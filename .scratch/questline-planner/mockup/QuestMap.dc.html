<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Questline map</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&amp;family=Atkinson+Hyperlegible:wght@400;700&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap">
<style>
body{margin:0}
.light{--bg:#eceef1;--surface:#f8f9fa;--sunk:#dfe2e7;--fg:#1a1d23;--muted:#5b6270;--line:#c9ced6;--accent:#946512;--accent-ink:#fff8e8;--hold:#56627a;--ok:#2e7a45;--warn:#a2402e}
.dark{--bg:#14161b;--surface:#1d2027;--sunk:#262a33;--fg:#e8eaee;--muted:#9aa1ae;--line:#343a45;--accent:#e0b04a;--accent-ink:#1a1408;--hold:#8d9ab3;--ok:#6cc489;--warn:#e07a63}
.qm-edge{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.qm-edge path{fill:none;stroke:var(--muted);stroke-width:1.6}
.qm-edge path.choice{stroke:var(--accent);stroke-dasharray:6 4}
.qm-edge path.stub{stroke-dasharray:2 4}
.qm-node{position:absolute;width:156px;height:92px;box-sizing:border-box;padding:8px 10px;background:var(--surface);border:1px solid var(--line);border-radius:10px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;font:inherit;color:inherit;cursor:pointer}
.qm-node.dim{opacity:.4}
.qm-node.hi{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.qm-node.sel{border-color:var(--fg);box-shadow:0 0 0 3px var(--fg)}
.qm-title{font:700 13px/1.25 'Atkinson Hyperlegible',sans-serif;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.qm-badge{font:600 12px 'JetBrains Mono',monospace;color:var(--muted);margin-right:4px}
.qm-pips{display:flex;gap:7px;align-items:center}
.qm-pip{display:inline-flex;align-items:center;gap:2px;font:600 9.5px 'JetBrains Mono',monospace;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--muted);box-sizing:border-box;display:inline-block}
.dot.done{background:var(--ok);border-color:var(--ok)}
.dot.review{border-color:var(--hold);background:radial-gradient(circle,var(--hold) 0 35%,transparent 40%)}
.dot.doing{border-color:var(--accent);background:linear-gradient(90deg,var(--accent) 50%,transparent 50%)}
.dot.na{border-style:dotted;opacity:.55}
.qm-ev{font:11px 'JetBrains Mono',monospace;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qm-label{position:absolute;transform:translate(-50%,-50%);font:600 10.5px 'JetBrains Mono',monospace;background:var(--bg);color:var(--accent);border:1px dashed var(--accent);border-radius:999px;padding:2px 8px;white-space:nowrap}
.qm-stub{position:absolute;transform:translateX(-50%);min-height:32px;padding:0 12px;border:1px dashed var(--line);border-radius:999px;background:var(--bg);color:var(--muted);font:600 11px 'JetBrains Mono',monospace;cursor:pointer;white-space:nowrap}
</style>
</helmet>
<div class="{{theme}}" style="position: relative; width: 920px; height: 592px; background: var(--bg); color: var(--fg); font-family: 'Atkinson Hyperlegible', system-ui, sans-serif">
  <sc-for list="{{edges}}" as="e" hint-placeholder-count="14">
    <svg class="qm-edge" width="920" height="592" aria-hidden="true"><path d="{{e.d}}" class="{{e.cls}}"></path></svg>
  </sc-for>
  <button type="button" class="qm-stub" style="left: 460px; top: 6px">from Collective Act 1 ▸</button>
  <sc-for list="{{labels}}" as="l" hint-placeholder-count="2">
    <span class="qm-label" style="left: {{l.x}}px; top: {{l.y}}px">{{l.text}}</span>
  </sc-for>
  <sc-for list="{{nodes}}" as="n" hint-placeholder-count="9">
    <button type="button" class="{{n.cls}}" style="left: {{n.x}}px; top: {{n.y}}px" aria-label="{{n.aria}}">
      <span class="qm-title"><span class="qm-badge">{{n.badge}}</span>{{n.title}}</span>
      <span class="qm-pips">
        <sc-for list="{{n.pips}}" as="p" hint-placeholder-count="4">
          <span class="qm-pip">{{p.k}}<span class="{{p.cls}}"></span></span>
        </sc-for>
      </span>
      <span class="qm-ev">{{n.ev}}</span>
    </button>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"filter":{"editor":"enum","options":["none","writing","choices","observations","art"],"default":"none"},"selected":{"editor":"text","default":""},"$preview":{"width":920,"height":592}}'>
class Component extends DCLogic {
  renderVals() {
    const W = 156, H = 92;
    const BADGE = { placeholder: '◌', hardcoded: '⚙︎', data: '●' };
    const CAT = { writing: 0, choices: 1, observations: 2, art: 3 };
    const Q = [
      ['open', 'Act 2 opens', 'placeholder', 460, 64, ['done', 'done', 'na', 'done'], 'col_a2_intro', 0],
      ['col_a2_hakim', 'Find out what’s wrong with Hakim', 'hardcoded', 100, 200, ['done', 'review', 'doing', 'todo'], 'col_a2_hakim_vein_lost', 1],
      ['col_a2_nadia_supplies', 'Stock the Collective’s kit', 'hardcoded', 280, 200, ['done', 'done', 'done', 'done'], 'col_a2_nadia_ledger', 0],
      ['col_a2_nadia_reseed', 'Seed a new vein for the Collective', 'hardcoded', 460, 200, ['doing', 'todo', 'todo', 'todo'], 'col_a2_reseed', 0],
      ['handler', 'Meet the handler', 'placeholder', 730, 200, ['review', 'doing', 'na', 'todo'], 'col_a2_handler_meet', 1],
      ['col_a2_nadia_defend', 'Defend the vein Nadia’s watching', 'hardcoded', 460, 340, ['done', 'done', 'review', 'doing'], 'col_a2_nadia_defend_brief', 1],
      ['vouch', 'Vouch for the handler', 'placeholder', 640, 340, ['todo', 'todo', 'na', 'todo'], 'col_a2_handler_vouch', 0],
      ['sellout', 'Sell the handler out', 'placeholder', 820, 340, ['todo', 'todo', 'na', 'todo'], 'col_a2_handler_sold', 0],
      ['closer', 'Close Act 2', 'placeholder', 460, 480, ['doing', 'todo', 'na', 'todo'], 'col_a2_closer', 2],
    ];
    const at = {};
    Q.forEach((q) => { at[q[0]] = q; });
    const filter = this.props.filter ?? 'none';
    const sel = this.props.selected ?? '';
    const nodes = Q.map(([id, title, state, cx, y, st, ev, more]) => {
      let cls = 'qm-node';
      if (filter !== 'none') cls += st[CAT[filter]] === 'done' || st[CAT[filter]] === 'na' ? ' dim' : ' hi';
      if (id === sel) cls += ' sel';
      return {
        cls, x: cx - W / 2, y, title, badge: BADGE[state],
        aria: title + ', ' + state,
        ev: ev + (more ? '  +' + more : ''),
        pips: ['W', 'C', 'O', 'A'].map((k, i) => ({ k, cls: 'dot ' + st[i] })),
      };
    });
    const curve = (x1, y1, x2, y2) => { const m = (y1 + y2) / 2; return 'M' + x1 + ' ' + y1 + ' C' + x1 + ' ' + m + ' ' + x2 + ' ' + m + ' ' + x2 + ' ' + y2; };
    const E = [
      ['open', 'col_a2_hakim'], ['open', 'col_a2_nadia_supplies'], ['open', 'col_a2_nadia_reseed'], ['open', 'handler'],
      ['col_a2_nadia_reseed', 'col_a2_nadia_defend'],
      ['handler', 'vouch', 'vouch'], ['handler', 'sellout', 'sell out'],
      ['col_a2_hakim', 'closer'], ['col_a2_nadia_supplies', 'closer'], ['col_a2_nadia_defend', 'closer'], ['vouch', 'closer'], ['sellout', 'closer'],
    ];
    const edges = E.map(([a, b, label]) => ({ d: curve(at[a][3], at[a][4] + H, at[b][3], at[b][4]), cls: label ? 'choice' : 'par' }));
    edges.push({ d: curve(460, 38, 460, 64), cls: 'stub' });
    const labels = E.filter((e) => e[2]).map(([a, b, text]) => ({ text, x: (at[a][3] + at[b][3]) / 2, y: (at[a][4] + H + at[b][4]) / 2 }));
    return { theme: this.props.theme ?? 'light', nodes, edges, labels };
  }
}
</script>
</body>
</html>
