<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quest sheet on phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&amp;family=Atkinson+Hyperlegible:wght@400;700&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap">
<style>
body{margin:0}
.light{--bg:#eceef1;--surface:#f8f9fa;--sunk:#dfe2e7;--fg:#1a1d23;--muted:#5b6270;--line:#c9ced6;--accent:#946512;--accent-ink:#fff8e8;--hold:#56627a;--ok:#2e7a45;--warn:#a2402e}
</style>
</helmet>
<div class="light" style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: var(--bg); color: var(--fg); font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; overflow: hidden">
  <div style="position: absolute; left: 0; top: 0; right: 0; padding: 12px 16px; background: var(--surface); border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center">
    <span style="font: 700 18px 'Pixelify Sans', monospace">Collective Act 2</span>
    <span style="font: 600 11px 'JetBrains Mono', monospace; color: var(--ok)">● Saved</span>
  </div>
  <div style="position: absolute; left: 0; top: 52px; width: 920px; transform: translateX(-12px)" aria-hidden="true">
    <dc-import name="QuestMap" theme="light" selected="col_a2_hakim" hint-size="920px,592px"></dc-import>
  </div>
  <div style="position: absolute; inset: 0; background: rgba(20,22,27,.35)" aria-hidden="true"></div>
  <div role="dialog" aria-label="Quest: Find out what’s wrong with Hakim" style="position: absolute; left: 0; right: 0; bottom: 0; height: 640px; overflow-y: auto; border-radius: 16px 16px 0 0; background: var(--surface); box-shadow: 0 -8px 24px rgba(0,0,0,.18)">
    <dc-import name="QuestSheet" theme="light" mode="sheet" hint-size="100%,1180px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
