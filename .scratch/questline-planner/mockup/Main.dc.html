<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Questline list</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&amp;family=Atkinson+Hyperlegible:wght@400;700&amp;family=JetBrains+Mono:wght@400;600&amp;display=swap">
<style>
body{margin:0}
a{color:#946512}a:hover{color:#6b4a0c}
.light{--bg:#eceef1;--surface:#f8f9fa;--sunk:#dfe2e7;--fg:#1a1d23;--muted:#5b6270;--line:#c9ced6;--accent:#946512;--accent-ink:#fff8e8;--hold:#56627a;--ok:#2e7a45;--warn:#a2402e}
.dark{--bg:#14161b;--surface:#1d2027;--sunk:#262a33;--fg:#e8eaee;--muted:#9aa1ae;--line:#343a45;--accent:#e0b04a;--accent-ink:#1a1408;--hold:#8d9ab3;--ok:#6cc489;--warn:#e07a63}
.ql-row{display:flex;flex-direction:column;gap:8px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-decoration:none;color:var(--fg);min-height:44px}
.ql-row.last{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.bar{height:5px;border-radius:3px;background:var(--sunk);overflow:hidden}
.bar span{display:block;height:100%;background:var(--ok)}
.tab{border:1px solid transparent;border-bottom:0;background:none;border-radius:6px 6px 0 0;padding:10px 12px;margin-bottom:-1px;font:600 12px/1 'JetBrains Mono',monospace;color:var(--muted);min-height:40px}
.tab.on{background:var(--surface);border-color:var(--line);color:var(--fg)}
</style>
</helmet>
<div class="{{theme}}" style="width: 390px; height: 844px; box-sizing: border-box; background: var(--bg); color: var(--fg); font-family: 'Atkinson Hyperlegible', system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 16px; background: var(--surface); border-bottom: 1px solid var(--line)">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="font: 700 18px/1.1 'Pixelify Sans', monospace">Vein storyboards</span>
      <span style="font: 11px/1.2 'JetBrains Mono', monospace; color: var(--muted)">server · 192.168.1.20:4317</span>
    </div>
    <span style="display: inline-flex; align-items: center; gap: 6px; font: 600 11px 'JetBrains Mono', monospace; color: var(--ok)"><svg width="8" height="8" aria-hidden="true"><circle cx="4" cy="4" r="4" fill="currentColor"></circle></svg>Saved</span>
  </header>
  <nav style="display: flex; flex-wrap: wrap; gap: 2px; padding: 8px 16px 0; border-bottom: 1px solid var(--line)" aria-label="Storyboard tabs">
    <button type="button" class="tab">Storyboard</button>
    <button type="button" class="tab">Shots</button>
    <button type="button" class="tab">Comments</button>
    <button type="button" class="tab on" aria-selected="true">Quests</button>
  </nav>
  <main style="flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
      <h1 style="margin: 0; font: 700 24px/1.1 'Pixelify Sans', monospace">Questlines</h1>
      <button type="button" style="min-height: 44px; padding: 0 16px; border: 0; border-radius: 10px; background: var(--accent); color: var(--accent-ink); font: 700 14px 'Atkinson Hyperlegible', sans-serif">+ Questline</button>
    </div>
    <sc-for list="{{pages}}" as="pg" hint-placeholder-count="3">
      <section style="display: flex; flex-direction: column; gap: 8px">
        <h2 style="margin: 0; font: 600 11px/1 'JetBrains Mono', monospace; letter-spacing: .08em; text-transform: uppercase; color: var(--muted)">{{pg.page}}</h2>
        <sc-for list="{{pg.lines}}" as="q" hint-placeholder-count="2">
          <a href="PhoneMap.dc.html" class="{{q.cls}}">
            <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 8px">
              <span style="font: 700 16px/1.25 'Atkinson Hyperlegible', sans-serif">{{q.name}}</span>
              <span style="font: 11px 'JetBrains Mono', monospace; color: var(--muted); white-space: nowrap">{{q.count}} quests</span>
            </div>
            <span style="font-size: 13px; line-height: 1.35; color: var(--muted)">{{q.premise}}</span>
            <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
              <sc-for list="{{q.rolls}}" as="r" hint-placeholder-count="4">
                <div style="display: flex; flex-direction: column; gap: 3px">
                  <span style="font: 600 10.5px 'JetBrains Mono', monospace; color: var(--muted)">{{r.label}} {{r.text}}</span>
                  <div class="bar"><span style="width: {{r.pct}}%"></span></div>
                </div>
              </sc-for>
            </div>
          </a>
        </sc-for>
      </section>
    </sc-for>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const roll = (a) => ['W', 'C', 'O', 'A'].map((label, i) => ({ label, text: a[i][0] + '/' + a[i][1], pct: Math.round(100 * a[i][0] / a[i][1]) }));
    const line = (name, count, premise, a, last) => ({ name, count, premise, rolls: roll(a), cls: last ? 'ql-row last' : 'ql-row' });
    return {
      theme: this.props.theme ?? 'light',
      pages: [
        { page: 'tutorial', lines: [line('Tutorial', 9, 'Mile End to first rent: Archie shows you the calc trade.', [[9, 9], [9, 9], [2, 3], [6, 9]])] },
        { page: 'collective', lines: [
          line('Collective Act 1', 6, 'The Collective needs ground, a supply line and Hakim back on his feet.', [[6, 6], [6, 6], [4, 4], [3, 6]]),
          line('Collective Act 2', 9, 'Hakim is off, a handler turns up, and Nadia’s vein draws the wrong eyes.', [[4, 9], [3, 9], [1, 4], [2, 9]], true),
        ] },
        { page: 'business_empire', lines: [line('Business Act 1', 8, 'James, a unit and fifteen items sold without you.', [[7, 8], [5, 8], [0, 2], [1, 8]])] },
      ],
    };
  }
}
</script>
</body>
</html>
