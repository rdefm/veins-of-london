<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BizBrief structure prototype</title>
  <style>
    /* Throwaway prototype: three BizBrief structures on one phone, ?variant=A|B|C. */
    :root{font-family:Arial,Helvetica,sans-serif;color:#fbfaf6;background:#dfe2e5}
    *{box-sizing:border-box}button{font:inherit;cursor:pointer}body{margin:0}
    .stage{min-height:100vh;display:grid;place-items:center;padding:26px 12px 94px;gap:12px}
    .note{width:min(390px,100%);color:#28313a;font-size:12px;line-height:1.4}
    .note strong{font-size:13px}.phone{width:min(390px,100%);height:min(844px,calc(100vh - 140px));min-height:600px;border:5px solid #151b22;border-radius:34px;overflow:hidden;background:#101923;box-shadow:0 20px 50px #10192355;display:flex;flex-direction:column}
    .gamebar{height:65px;flex:none;background:#050606;color:#ffbc0c;border-bottom:3px solid #383f49;padding:8px 11px;font:15px/1.1 monospace;text-transform:uppercase;letter-spacing:1px}
    .phone-status{height:30px;flex:none;background:#172431;display:flex;justify-content:space-between;padding:8px 16px 0;font-size:12px}
    .apphead{background:#172431;border-bottom:1px solid #354454;padding:8px 14px 9px;flex:none}
    .headrow{display:flex;align-items:center;gap:9px}.icon{width:25px;height:25px;border-radius:5px;object-fit:cover}.brand{font:24px Georgia,serif;letter-spacing:-1px}.day{margin-left:auto;font-size:10px;color:#a9b5bd;text-transform:uppercase}.back{border:0;background:none;color:#a9b5bd;padding:0 0 7px;font-size:12px}
    .tabs{height:45px;flex:none;display:flex;background:#172431;border-bottom:1px solid #354454}.tab{flex:1;color:#a9b5bd;background:transparent;border:0;border-bottom:3px solid transparent;font-size:11px}.tab.active{color:#fbfaf6;border-bottom-color:#e9353c}
    .viewport{flex:1;min-height:0;overflow-y:auto;scrollbar-color:#64717c transparent}.page{padding:14px 13px 24px}.dock{height:48px;flex:none;background:#f6f4ef;color:#e9353c;display:flex;align-items:center;justify-content:space-around;border-top:1px solid #bdc0c3;font-size:11px}.dock span{width:33%;text-align:center}
    h1,h2,h3,p{margin:0}h1,h2,h3,.serif{font-family:Georgia,'Times New Roman',serif;font-weight:400}h1{font-size:20px}h2{font-size:17px}h3{font-size:15px}.small{font-size:12px;line-height:1.35}.muted{color:#a9b5bd}.eyebrow{color:#a9b5bd;font-size:10px;font-weight:700;letter-spacing:.11em;text-transform:uppercase}.red{color:#ff646a}.green{color:#b4d6c2}.num{font-variant-numeric:tabular-nums}.row{display:flex;align-items:center;justify-content:space-between;gap:9px}.stack{display:grid;gap:10px}.rule{height:1px;background:#354454;margin:11px 0}.section-head{display:flex;justify-content:space-between;align-items:baseline;margin:17px 0 9px}.section-head:first-child{margin-top:0}
    .card{background:#1b2a38;border:1px solid #354454;border-radius:6px;padding:12px}.hero{background:#1e3040;border-left:3px solid #e9353c}.card + .card{margin-top:8px}.flat{border-bottom:1px solid #354454;padding:11px 0}.flat:last-child{border:0}.topline{display:flex;gap:8px;align-items:baseline;justify-content:space-between}.hint{font-size:11px;color:#a9b5bd}.pill{padding:3px 6px;border:1px solid #4a5965;border-radius:3px;font-size:9px;text-transform:uppercase;letter-spacing:.04em}.pill.danger{border-color:#e9353c;color:#ff777a}.pill.good{color:#b4d6c2;border-color:#5c8572}
    .link,.quiet,.primary{border:0;background:none;color:#ff646a;font-weight:700;font-size:12px;padding:7px 0;text-align:left}.primary{background:#e9353c;color:white;padding:9px 11px;border-radius:4px;text-align:center}.outline{border:1px solid #e9353c;border-radius:4px;padding:8px 10px;color:#ff646a;background:none;font-size:12px}.chev{color:#ff646a;font-size:18px}.navrow{display:flex;align-items:center;gap:11px;width:100%;border:0;border-bottom:1px solid #354454;color:#fbfaf6;background:none;padding:13px 2px;text-align:left}.navrow:last-child{border:0}.navrow .main{flex:1}.navrow h3{margin-bottom:3px}.navrow .chev{align-self:center}
    .task{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:11px 0;border-bottom:1px solid #354454}.task:last-child{border:0}.task strong{font-size:13px;line-height:1.3}.task p{font-size:12px;color:#a9b5bd;line-height:1.35}.task button{grid-column:2;grid-row:1 / span 2;align-self:center}.task.done{opacity:.58}.tier{display:flex;align-items:center;gap:8px;margin:13px 0 0;color:#bfcad0;font-size:10px;letter-spacing:.14em;font-weight:700;text-transform:uppercase}.tier:after{content:"";height:1px;flex:1;background:#354454}.tier.urgent{color:#ff777a}
    .blocks{font-size:11px;color:#a9b5bd}.blocks b{color:#fbfaf6;letter-spacing:2px}.summary-bar{display:flex;gap:8px;margin-top:11px}.summary-bar button{flex:1;text-align:left;border:1px solid #354454;background:#1b2a38;color:#fbfaf6;padding:10px 8px;border-radius:5px;font-size:11px}.summary-bar b{display:block;font:16px Georgia,serif;margin:3px 0}.summary-bar small{color:#a9b5bd}
    .section-link{margin-top:8px;border:1px solid #354454;background:#172431;color:#fbfaf6;padding:10px;width:100%;text-align:left;border-radius:5px}.section-link span:last-child{float:right;color:#ff646a}
    .dashboard-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.dashboard-grid .card{margin:0;min-height:100px}.dashboard-grid .wide{grid-column:1 / -1}.metric{font:26px Georgia,serif;margin:6px 0 3px}.mini-list{font-size:12px;line-height:1.55;color:#c4cdd2}.dashboard-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.dashboard-actions button{border:1px solid #354454;color:#fbfaf6;background:#1b2a38;text-align:left;border-radius:5px;padding:11px;font-size:12px}
    .ledger-head{border-bottom:2px solid #e9353c;padding-bottom:11px;margin-bottom:8px}.ledger-count{font:42px Georgia,serif;line-height:1}.ledger-section{border-top:1px solid #64717c;margin-top:18px}.ledger-section>.eyebrow{padding-top:10px}.ledger-line{display:grid;grid-template-columns:54px 1fr 20px;gap:8px;border-bottom:1px solid #354454;padding:12px 0;align-items:start}.ledger-line b{font-size:12px}.ledger-line p{color:#a9b5bd;font-size:11px;line-height:1.4;margin-top:4px}.ledger-tag{font-size:9px;color:#ff777a;text-transform:uppercase;letter-spacing:.04em}.ledger-line button{border:0;background:none;color:#ff646a;font-size:18px}.ledger-strip{margin:18px 0 8px;padding:10px 0;border-top:1px solid #354454;border-bottom:1px solid #354454;display:flex;justify-content:space-between;font-size:12px}
    .progress{height:5px;background:#354454;border-radius:4px;margin:9px 0}.progress i{display:block;height:100%;background:#e9353c;border-radius:4px}.person{display:flex;align-items:center;gap:10px}.avatar{width:36px;height:36px;background:#2b3b4b;border:1px solid #53636f;border-radius:5px;display:grid;place-items:center;font-size:11px;color:#fbfaf6}.subnav{display:flex;gap:8px;align-items:center;margin-bottom:13px}.subnav button{border:0;color:#ff646a;background:none;padding:0;font-size:12px}.subnav span{color:#a9b5bd;font-size:12px}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.detail-grid .card{margin:0}.control-row{display:flex;gap:7px;align-items:center;margin-top:10px}.control-row button{border:1px solid #53636f;background:#2b3b4b;color:#fbfaf6;border-radius:3px;padding:7px 10px}.control-row span{flex:1;text-align:center}
    .switcher{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);z-index:10;display:flex;align-items:center;gap:9px;background:#f9fafb;color:#14202c;border:1px solid #9fa6ac;box-shadow:0 7px 25px #1118;border-radius:99px;padding:5px 8px 5px 11px;font-size:12px;white-space:nowrap}.switcher button{border:0;border-radius:50%;background:#14202c;color:white;width:29px;height:29px}.switcher .label{min-width:140px;text-align:center;font-weight:700}.sample{position:fixed;right:12px;top:12px;z-index:10;background:#fff;color:#263440;border:1px solid #acb2b6;border-radius:5px;font-size:11px;padding:8px}.toast{position:fixed;left:50%;bottom:63px;transform:translateX(-50%);background:#fff;color:#263440;border:1px solid #acb2b6;padding:8px 12px;border-radius:5px;font-size:12px;z-index:9;display:none}.toast.show{display:block}
    @media(max-width:520px){.stage{padding:0 0 70px;display:block}.note{display:none}.phone{width:100%;height:calc(100dvh - 66px);min-height:0;border-radius:0;border:0;box-shadow:none}.sample{top:auto;bottom:65px;right:9px;opacity:.95}.switcher{bottom:12px}.gamebar{height:53px}}
  </style>
</head>
<body>
  <div class="stage">
    <div class="note"><strong>BizBrief structure prototype</strong><br>Illustrative Day 24 data. Tap tabs, rows and arrows. Switch layouts with the floating control.</div>
    <div class="phone" id="phone"></div>
  </div>
  <button class="sample" id="sample" type="button">Sample: busy day ↔ quiet day</button>
  <div class="toast" id="toast"></div>
  <div class="switcher"><button id="prev" aria-label="Previous layout">‹</button><span class="label" id="variant-label"></span><button id="next" aria-label="Next layout">›</button></div>
  <script>
    const names={A:'Focused Brief',B:'Operations Dashboard',C:'Daily Docket'};
    const order=['A','B','C'];
    const icon='../../assets/phone/icons/bizbrief.png';
    let variant=order.includes(new URLSearchParams(location.search).get('variant'))?new URLSearchParams(location.search).get('variant'):'A';
    let tab='Brief',view='',quiet=false,toastTimer;
    const $=s=>document.querySelector(s);
    function setVariant(v){variant=v;history.replaceState(null,'',`${location.pathname}?variant=${v}`);tab='Brief';view='';render()}
    function cycle(n){setVariant(order[(order.indexOf(variant)+n+order.length)%order.length])}
    function say(message){$('#toast').textContent=message;$('#toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.remove('show'),2200)}
    function head(){return `<div class="gamebar">☀ TUE 24 APR MORNING<br>◫◫◫ £1840</div><div class="phone-status"><span>08:14</span><span>▂▄▆█　◉　▰ 87%</span></div><div class="apphead"><button class="back" data-go="phone">‹ Phone</button><div class="headrow"><img class="icon" src="${icon}" alt=""><div class="brand">BizBrief</div><div class="day">Day 24 · Morning</div></div></div><div class="tabs">${['Brief','Manage','Staff','Stats'].map(t=>`<button class="tab ${tab===t?'active':''}" data-tab="${t}">${t}</button>`).join('')}</div>`}
    function task(title,detail,action,route,done=false){return `<div class="task ${done?'done':''}"><div><strong>${title}</strong><p>${detail}</p></div><button class="link" data-go="${route}">${action} →</button></div>`}
    function navrow(title,detail,route,meta=''){return `<button class="navrow" data-go="${route}"><div class="main"><h3>${title}</h3><div class="small muted">${detail}</div></div>${meta?`<span class="eyebrow">${meta}</span>`:''}<span class="chev">›</span></button>`}
    function focusedBrief(){return `<div class="page"><div class="row"><h1>Today</h1><div class="blocks">Tue, 24 Apr · <b>●●●</b></div></div><div class="small muted" style="margin-top:4px">Three blocks left. Start with what has a deadline.</div>${quiet?`<div class="card hero" style="margin-top:16px"><h2>Nothing pressing today.</h2><p class="small muted" style="margin-top:6px">Check your orders or use the day to prospect.</p></div>`:`<div class="tier urgent">Urgent · 2</div>${task('Whitechapel raid','Intervention closes tonight. Claim at risk.','Respond','alarm')}${task('Stepney order short by 2 Time','Due tomorrow. A short delivery pays less.','Check order','contract')}<div class="tier">Story · 1</div>${task('Meet Archie at the lock-up','The next business step is waiting at HQ.','Go','story')}<div class="tier">Opportunity · 5</div>${task('Four prices are up','Blast, Shield, Black Hole, Healing Burst.','See prices','prices')}${task('Guild offer · 6 Time','£360 per delivery. Expires tomorrow.','Review','offer')}<div class="tier">Routine</div>${task('1 vein ready · Owen idle','Maintenance can wait until urgent work is handled.','Show','routine')}`}<div class="section-head"><h2>Yesterday</h2><span class="eyebrow">Day 23</span></div><button class="section-link" data-go="morning">+£430 cash · 12 Time ore · 5 pearls <span>Full report ›</span></button><div class="section-head"><h2>Business</h2></div>${navrow('Money','Pot £1,220 · bill float £340','money')}${navrow('Market position','Shares, rival moves and war','market')}</div>`}
    function dashboardBrief(){return `<div class="page"><div class="row"><h1>Morning overview</h1><span class="eyebrow">3 blocks</span></div><div class="dashboard-grid" style="margin-top:13px"><div class="card hero wide"><div class="eyebrow">${quiet?'Today':'Next decision'}</div><div class="metric" style="font-size:21px">${quiet?'Nothing pressing today.':'Whitechapel raid'}</div><p class="small muted">${quiet?'Use the day to prospect or check your operation.':'Defend before the end of today.'}</p>${quiet?'':`<button class="link" data-go="alarm">Respond →</button>`}</div><div class="card"><div class="eyebrow">Orders</div><div class="metric">${quiet?'0 due':'2 active'}</div><p class="small muted">${quiet?'No deadline today':'1 short · 1 new offer'}</p></div><div class="card"><div class="eyebrow">Cash</div><div class="metric">£1,840</div><p class="small muted">+£430 yesterday</p></div><div class="card"><div class="eyebrow">Production</div><div class="metric">5 pearls</div><p class="small muted">made yesterday</p></div><div class="card"><div class="eyebrow">People</div><div class="metric">${quiet?'All set':'1 idle'}</div><p class="small muted">${quiet?'Assignments covered':'Owen has no assignment'}</p></div></div><div class="section-head"><h2>${quiet?'Quiet day':'Also on today'}</h2></div><div class="card">${quiet?`<p class="small muted">Nothing needs a decision. Your operation is steady.</p>`:`<div class="mini-list">◆ Meet Archie at the lock-up<br>£ Four prices are up<br>£ Guild offer expires tomorrow<br>○ 1 vein ready to develop</div>`}</div><div class="dashboard-actions"><button data-go="all-today">All tasks →</button><button data-go="morning">Morning report →</button><button data-go="money">Move funds →</button><button data-go="market">Market position →</button></div></div>`}
    function docketLine(tag,title,detail,route){return `<div class="ledger-line"><div class="ledger-tag">${tag}</div><div><b>${title}</b><p>${detail}</p></div><button aria-label="Open ${title}" data-go="${route}">›</button></div>`}
    function docketBrief(){return `<div class="page"><div class="ledger-head"><div class="eyebrow">Tuesday 24 April · Day 24</div><div class="row" style="margin-top:6px"><div><div class="ledger-count">${quiet?'0':'3'}</div><div class="small muted">things need you</div></div><div class="blocks">Blocks left<br><b>●●●</b></div></div></div>${quiet?`<h2>Nothing pressing today.</h2><p class="small muted" style="margin-top:7px">Orders, production and the map are ready when you are.</p>`:`<div class="ledger-section"><div class="eyebrow">Now</div>${docketLine('Tonight','Whitechapel raid','Claim at risk · intervention closes today','alarm')}${docketLine('Tomorrow','Stepney order','2 Time short · reduced payment if missed','contract')}</div><div class="ledger-section"><div class="eyebrow">Next</div>${docketLine('Story','Meet Archie','At the lock-up · next business step','story')}${docketLine('Market','Four prices up','You hold Blast, Shield, Black Hole and Healing Burst','prices')}${docketLine('Offer','Guild · 6 Time','£360 per delivery · expires tomorrow','offer')}</div><div class="ledger-section"><div class="eyebrow">When ready</div>${docketLine('Routine','1 vein ready · Owen idle','Maintenance and assignments','routine')}</div>`}<div class="ledger-strip"><span>Yesterday · cash <b>+£430</b></span><button class="link" data-go="morning">Read report →</button></div>${navrow('Money','Pot £1,220 · float £340','money')}${navrow('Market position','Shares and rival moves','market')}</div>`}
    function manageHome(){if(variant==='B')return `<div class="page"><h1>Manage the business</h1><div class="dashboard-grid" style="margin-top:13px"><div class="card hero wide"><div class="eyebrow">Sales</div><div class="metric">2 active · 1 offer</div><p class="small muted">Stepney order short by 2 Time</p><button class="link" data-go="sales">Open sales →</button></div><div class="card" data-go="production"><div class="eyebrow">Production</div><div class="metric" style="font-size:19px">5 pearls</div><p class="small muted">made yesterday</p><button class="link" data-go="production">Set targets →</button></div><div class="card"><div class="eyebrow">Procurement</div><div class="metric" style="font-size:19px">2 veins</div><p class="small muted">1 unassigned</p><button class="link" data-go="procurement">Assign →</button></div></div></div>`;if(variant==='C')return `<div class="page"><div class="ledger-head"><div class="eyebrow">Business controls</div><h1 style="margin-top:5px">Manage</h1></div><div class="ledger-section"><div class="eyebrow">Workstream</div>${docketLine('01','Sales','2 active orders · 1 new offer','sales')}${docketLine('02','Production','Time Pearl target 5 · covering contracts','production')}${docketLine('03','Procurement','Owen has 1 vein · 1 vein unassigned','procurement')}</div></div>`;return `<div class="page"><div class="row"><h1>Manage</h1><span class="eyebrow">Choose a workstream</span></div><div class="card hero" style="margin-top:14px"><div class="eyebrow">Needs attention</div><h2 style="margin-top:5px">Stepney order short by 2 Time</h2><p class="small muted" style="margin-top:5px">Due tomorrow · a short delivery pays less.</p><button class="link" data-go="contract">Check order →</button></div><div class="section-head"><h2>Workstreams</h2></div>${navrow('Sales','2 active orders · 1 offer awaiting you','sales')}${navrow('Production','Time Pearl target 5 · contract coverage on','production')}${navrow('Procurement','Owen on 1 vein · 1 vein unassigned','procurement')}<p class="small muted" style="margin-top:13px">Each workstream opens its own short page.</p></div>`}
    function subnav(title,parent='Manage'){return `<div class="subnav"><button data-go="${parent==='Manage'?'manage-home':parent==='Brief'?'brief-home':parent==='Staff'?'staff-home':'stats-home'}">‹ ${parent}</button><span>/ ${title}</span></div>`}
    function sales(){return `<div class="page">${subnav('Sales')}<div class="row"><h1>Sales</h1><span class="eyebrow">2 active · 1 offer</span></div><div class="section-head"><h2>Offered</h2><span class="eyebrow">Expires tomorrow</span></div><button class="navrow" data-go="offer"><div class="main"><h3>Guild · 6 Time ore</h3><div class="small muted">Weekly · £360 per delivery</div></div><span class="chev">›</span></button><div class="section-head"><h2>Accepted</h2><button class="link" data-go="history">History →</button></div><button class="navrow" data-go="contract"><div class="main"><h3>Stepney order <span class="red">· short 2</span></h3><div class="small muted">4 / 6 Time · due tomorrow</div><div class="progress"><i style="width:67%"></i></div></div><span class="chev">›</span></button><button class="navrow" data-go="contract2"><div class="main"><h3>Pearl order</h3><div class="small muted">3 / 5 Time Pearls · due Friday</div><div class="progress"><i style="width:60%"></i></div></div><span class="chev">›</span></button><p class="small muted" style="margin-top:13px">Drag accepted orders to set delivery priority.</p></div>`}
    function production(){return `<div class="page">${subnav('Production')}<div class="row"><h1>Production</h1><button class="link" data-go="log">Log →</button></div><p class="small muted" style="margin:7px 0 14px">Set personal stock targets and whether production covers active contracts.</p><div class="card"><h2>Time Pearl</h2><p class="small muted" style="margin-top:5px">Personal target 5 · contract need 2</p><div class="control-row"><button data-go="stub">−</button><span>Target 5</span><button data-go="stub">+</button></div><div class="rule"></div><div class="row"><span class="small">Cover contract needs</span><span class="pill good">On</span></div></div><div class="card"><h2>Healing Burst</h2><p class="small muted" style="margin-top:5px">Personal target 2 · contract need 0</p><div class="control-row"><button data-go="stub">−</button><span>Target 2</span><button data-go="stub">+</button></div><div class="rule"></div><div class="row"><span class="small">Cover contract needs</span><span class="pill">Off</span></div></div></div>`}
    function procurement(){return `<div class="page">${subnav('Procurement')}<div class="row"><h1>Procurement</h1><span class="eyebrow">1 vein unassigned</span></div><p class="small muted" style="margin:7px 0 14px">Assign veins to cultivators, then set their picking targets.</p><div class="card"><div class="person"><div class="avatar">OW</div><div><h2>Owen</h2><div class="small muted">Cultivation · 1 assigned vein</div></div></div><div class="rule"></div><div class="row"><div><h3>Whitechapel · Time</h3><div class="small muted">Picking target 10</div></div><button class="link" data-go="vein">Edit →</button></div><div class="rule"></div><button class="outline" data-go="assign">Assign vein →</button></div><button class="navrow" data-go="assign"><div class="main"><h3>Unassigned veins</h3><div class="small muted">Stepney · Life</div></div><span class="chev">›</span></button></div>`}
    function staff(){return `<div class="page"><div class="row"><h1>Staff</h1><span class="eyebrow">3 recruited</span></div><div class="card hero" style="margin-top:13px"><div class="eyebrow">Payroll</div><h2 style="margin-top:5px">£40 owed</h2><p class="small muted" style="margin-top:5px">Owen is stopped until paid.</p><button class="link" data-go="person">Pay Owen →</button></div><div class="section-head"><h2>Roster</h2></div>${navrow('Owen','Cultivation · wage owed £40','person','DUE')}${navrow('James','Production · working','person2','WORKING')}${navrow('Archie','Sales · working','person3','WORKING')}</div>`}
    function stats(){return `<div class="page"><div class="row"><h1>Stats</h1><span class="eyebrow">Last 10 completed days</span></div><div class="detail-grid" style="margin-top:13px"><div class="card hero"><div class="eyebrow">Revenue</div><div class="metric">£3,460</div></div><div class="card"><div class="eyebrow">Expenses</div><div class="metric">£1,180</div></div></div><div class="section-head"><h2>Daily trend</h2></div><div class="card"><svg viewBox="0 0 300 100" style="width:100%;height:105px"><path d="M0 80 L40 70 L80 62 L120 69 L160 48 L200 57 L240 34 L280 21" fill="none" stroke="#e9353c" stroke-width="3"/><path d="M0 87 L40 78 L80 76 L120 70 L160 73 L200 60 L240 57 L280 51" fill="none" stroke="#8ca0ad" stroke-width="3"/></svg><div class="small muted">● Revenue　● Expenses</div></div>${navrow('Expense breakdown','Staff £590 · guards £420 · calc £170','expenses')}${navrow('Ore yield','Cultivators and your own picking','yield')}${navrow('Items produced','18 in this window','items')}</div>`}
    function detail(){const titles={alarm:'Whitechapel raid',contract:'Stepney order',contract2:'Pearl order',story:'Meet Archie',prices:'Prices up today',offer:'Guild offer',routine:'Routine work',morning:'Morning report',money:'Business money',market:'Market position',person:'Owen',person2:'James',person3:'Archie',assign:'Assign a vein',vein:'Whitechapel · Time',history:'Sales history',log:'Production log',expenses:'Expense breakdown',yield:'Ore yield',items:'Items produced','all-today':'All of today'};const parent=['contract','contract2','offer','history'].includes(view)?'Manage':['person','person2','person3'].includes(view)?'Staff':view==='log'?'Manage':['expenses','yield','items'].includes(view)?'Stats':'Brief';let body='';switch(view){case 'contract':body=`<div class="card hero"><div class="eyebrow">Urgent · due tomorrow</div><h2 style="margin-top:6px">4 of 6 Time delivered</h2><div class="progress"><i style="width:67%"></i></div><p class="small muted">Two short. A short period pays less.</p></div><div class="section-head"><h2>Order details</h2></div><div class="card"><div class="flat row"><span>Buyer</span><b>The Guild</b></div><div class="flat row"><span>Payment</span><b>£360 per delivery</b></div><div class="flat row"><span>Buy missing calc</span><b>Off</b></div></div><button class="primary" data-go="stub" style="margin-top:15px">Buy missing calc: off</button>`;break;
      case 'offer':body=`<div class="card hero"><div class="eyebrow">Weekly offer · expires tomorrow</div><h2 style="margin-top:6px">The Guild · 6 Time ore</h2><p class="small muted" style="margin-top:6px">£360 per delivery</p><div class="row" style="margin-top:15px"><button class="outline" data-go="stub">Decline</button><button class="primary" data-go="stub">Accept</button></div></div>`;break;
      case 'prices':body=`<p class="small muted">Demand is up. You hold each of these goods.</p>${['Blast · 3 held · +76%','Shield · 2 held · +76%','Black Hole · 2 held · +76%','Healing Burst · 3 held · +76%'].map(x=>navrow(x,'Open Trade to sell','trade')).join('')}`;break;
      case 'money':body=`<div class="detail-grid"><div class="card hero"><div class="eyebrow">Business pot</div><div class="metric">£1,220</div></div><div class="card"><div class="eyebrow">Bill float</div><div class="metric">£340</div></div></div><p class="small muted" style="margin:13px 0">The float pays bills the pot cannot cover. Payday never splits it.</p><div class="card"><h2>Move money</h2><div class="control-row"><button data-go="stub">−</button><span>£50</span><button data-go="stub">+</button></div><div class="row" style="margin-top:11px"><button class="outline" data-go="stub">Donate</button><button class="outline" data-go="stub">Withdraw</button></div></div>`;break;
      case 'morning':body=`<div class="card hero"><div class="eyebrow">Day 23 · overnight</div><h2 style="margin-top:6px">Reynard's £1,840</h2><p class="small muted" style="margin-top:6px">Opening £1,410 · income +£640 · expenses −£210</p></div><div class="section-head"><h2>Operations</h2></div><div class="card"><div class="flat row"><span>Time ore produced</span><b>+12</b></div><div class="flat row"><span>Time Pearls made</span><b>+5</b></div><div class="flat row"><span>Guard wages paid</span><b>−£80</b></div></div><div class="section-head"><h2>Business context</h2></div>${navrow('Rival moves','Latest five moves against you','market')}${navrow('Market position','Shares, supplier split and war','market')}`;break;
      case 'market':body=`${navrow('Moves against you','Latest five faction moves','stub')}${navrow('War and weariness','Weariness 0 / 100 · not at war','stub')}${navrow('Your share of London','Ore and crafting share by type','stub')}${navrow('Supplier share','Delivery split by buyer','stub')}`;break;
      case 'person':body=`<div class="card hero"><div class="person"><div class="avatar">OW</div><div><h2>Owen</h2><p class="small muted">Cultivation · £40 owed · stopped</p></div></div><button class="primary" data-go="stub" style="margin-top:13px">Top up £40 and pay</button></div><div class="section-head"><h2>Role and skills</h2></div><div class="card"><div class="flat row"><span>Role</span><b>Cultivation</b></div><div class="flat row"><span>Cultivating</span><b>Level 4</b></div><div class="flat row"><span>Crafting</span><b>Level 2</b></div></div>${navrow('Assigned veins','Whitechapel · Time','procurement')}`;break;
      case 'assign':body=`<p class="small muted">Choose one unassigned vein for Owen.</p>${navrow('Stepney · Life','Unassigned · target 0','stub')}`;break;
      default:body=`<div class="card"><p class="small muted">This mockup shows the route and page hierarchy. Existing game controls would appear here.</p></div>`}
      return `<div class="page">${subnav(titles[view]||view,parent)}<h1 style="margin-bottom:14px">${titles[view]||view}</h1>${body}</div>`}
    function render(){let body=view==='sales'?sales():view==='production'?production():view==='procurement'?procurement():view==='all-today'?focusedBrief():view?detail():tab==='Brief'?(variant==='A'?focusedBrief():variant==='B'?dashboardBrief():docketBrief()):tab==='Manage'?manageHome():tab==='Staff'?staff():stats();$('#phone').innerHTML=head()+`<div class="viewport">${body}</div><div class="dock"><span>▯<br>Phone</span><span>♧<br>Map</span><span>⌂<br>HQ</span></div>`;$('#variant-label').textContent=`${variant} — ${names[variant]}`;$('#sample').textContent=`Sample: ${quiet?'quiet':'busy'} day ↔`}
    document.addEventListener('click',e=>{const t=e.target.closest('[data-tab],[data-go]');if(!t)return;if(t.dataset.tab){tab=t.dataset.tab;view='';render();return}const go=t.dataset.go;if(go==='stub'||['phone','trade'].includes(go)){say('Illustrative route — no game action');return}if(go==='brief-home'){tab='Brief';view=''}else if(go==='manage-home'){tab='Manage';view=''}else if(go==='staff-home'){tab='Staff';view=''}else if(go==='stats-home'){tab='Stats';view=''}else if(['sales','production','procurement'].includes(go)){tab='Manage';view=go}else{view=go}render()});
    $('#prev').onclick=()=>cycle(-1);$('#next').onclick=()=>cycle(1);$('#sample').onclick=()=>{quiet=!quiet;tab='Brief';view='';render()};
    document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName)||document.activeElement.isContentEditable)return;if(e.key==='ArrowLeft')cycle(-1);if(e.key==='ArrowRight')cycle(1)});
    render();
  </script>
</body>
