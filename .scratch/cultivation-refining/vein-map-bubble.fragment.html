<div id="vein-bubble-review" aria-label="Vein map bubble concept">
<style>
#vein-bubble-review{--paper:light-dark(#f0eee6,#191e20);--ink:light-dark(#252e30,#e2e7df);--dim:light-dark(#65716c,#99aaa1);--line:light-dark(#c0c8bb,#384742);--gold:light-dark(#957019,#d6b763);--map:light-dark(#dedfd3,#101719);font:14px/1.4 system-ui;color:var(--ink);max-width:390px;margin:0 auto}
#vein-bubble-review *{box-sizing:border-box}#vein-bubble-review button{font:inherit;color:inherit;cursor:pointer}#vein-bubble-review .map{position:relative;height:440px;overflow:hidden;background:var(--map);border-radius:20px}#vein-bubble-review .network{position:absolute;width:100%;height:100%;color:var(--line)}#vein-bubble-review .district{position:absolute;bottom:52px;left:24px;color:var(--dim);font-size:12px;letter-spacing:2px}#vein-bubble-review .bubble{position:relative;top:36px;width:268px;margin:auto;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:14px 16px;box-shadow:0 10px 24px #0002}#vein-bubble-review .bubble:after{content:'';position:absolute;width:18px;height:18px;background:var(--paper);border-bottom:1px solid var(--line);border-right:1px solid var(--line);transform:rotate(45deg);bottom:-10px;left:calc(50% - 9px)}#vein-bubble-review .info{border:0;background:none;padding:0;width:100%;text-align:left;display:block}#vein-bubble-review .heading{display:flex;align-items:center;justify-content:space-between;font-weight:500}#vein-bubble-review .levels{display:flex;align-items:center;gap:9px;margin-top:10px;font-size:12px}#vein-bubble-review .pips{display:flex;gap:4px}#vein-bubble-review .pips i{display:block;width:23px;height:6px;background:var(--line);border-radius:2px}#vein-bubble-review .pips i.filled{background:var(--ink)}#vein-bubble-review .gauge{width:100%;height:104px;display:block;margin-top:8px}#vein-bubble-review .gauge text{fill:var(--dim);font:11px system-ui}#vein-bubble-review .gauge .value{fill:var(--ink);font:500 24px system-ui}#vein-bubble-review .status{display:flex;justify-content:center;gap:7px;font-size:11px;color:var(--gold);min-height:18px}#vein-bubble-review .status svg{width:13px;height:13px}#vein-bubble-review .actions{display:flex;justify-content:center;gap:40px;margin-top:12px}#vein-bubble-review .action{text-align:center;font-size:11px}#vein-bubble-review .round{display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:50%;width:44px;height:44px;background:var(--map);margin-bottom:4px}#vein-bubble-review .round svg{width:20px;height:20px}#vein-bubble-review .pin{position:absolute;left:calc(50% - 10px);top:340px;width:20px;height:20px;border-radius:50%;background:var(--gold);border:5px solid var(--paper)}#vein-bubble-review .preview{margin-top:12px;border-top:1px solid var(--line);padding-top:10px;font-size:12px}#vein-bubble-review .preview button{width:100%;background:var(--map);border:0;padding:8px;margin-top:5px;border-radius:6px;text-align:left}#vein-bubble-review .map.expanded{height:550px}
#vein-bubble-review .gauge{height:64px;margin-top:10px}#vein-bubble-review .gauge .value{font:500 14px system-ui}#vein-bubble-review .pin{top:280px}
</style>
<div class="map">
<svg class="network" viewBox="0 0 390 440" preserveAspectRatio="none" aria-label="Schematic network backdrop"><path d="M-20 370H80L140 310H270L410 170M-20 180H100L195 275V450M30 0V80L95 145H300L410 35" fill="none" stroke="currentColor" stroke-width="3"/><g fill="var(--map)" stroke="currentColor" stroke-width="3"><circle cx="80" cy="370" r="7"/><circle cx="300" cy="145" r="7"/><circle cx="95" cy="145" r="7"/><circle cx="270" cy="310" r="7"/></g></svg>
<div class="district">WHITECHAPEL</div><span class="pin"></span>
<div class="bubble">
<button class="info" aria-label="Open vein details"><span class="heading"><span>Whitechapel · Time</span><i data-lucide="chevron-right" aria-hidden="true"></i></span><span class="levels"><span>Lv 2/4</span><span class="pips" aria-label="2 of 4 levels"><i class="filled"></i><i class="filled"></i><i></i><i></i></span></span>
<svg class="gauge" viewBox="0 0 234 64" role="img" aria-label="Condition 94; development zone 90 and above">
<text x="4" y="14">Condition</text><text class="value" x="230" y="14" text-anchor="end">94</text>
<rect x="4" y="27" width="226" height="8" rx="4" fill="var(--line)"/>
<rect x="207.4" y="27" width="22.6" height="8" rx="3" fill="var(--gold)"/>
<path d="M117 24V38" stroke="var(--ink)" stroke-width="1"/><text x="117" y="53" text-anchor="middle">50</text><text x="4" y="53">0</text><text x="230" y="53" text-anchor="end">90+</text>
<line class="needle" x1="216.44" y1="23" x2="216.44" y2="39" stroke="var(--ink)" stroke-width="3"/>
</svg><span class="status"><i data-lucide="sprout" aria-hidden="true"></i><span>Developing</span><span>·</span><i data-lucide="shield-alert" aria-hidden="true"></i><span>Raid risk ↑</span></span></button>
<div class="actions"><div class="action"><button class="round harvest" aria-label="Harvest"><i data-lucide="scissors" aria-hidden="true"></i></button>Harvest</div><div class="action"><button class="round cultivate" aria-label="Cultivate"><i data-lucide="sprout" aria-hidden="true"></i></button>Cultivate</div></div>
<div class="preview" hidden aria-live="polite"></div>
</div></div>
</div>
<script>
(()=>{const root=document.getElementById('vein-bubble-review');const state={condition:94,labels:true};const preview=root.querySelector('.preview');const map=root.querySelector('.map');function render(){const v=state.condition;root.querySelector('.value').textContent=v;const needle=root.querySelector('.needle');needle.setAttribute('x1',4+226*v/100);needle.setAttribute('x2',4+226*v/100);root.querySelector('.gauge').setAttribute('aria-label',`Condition ${v}; development zone 90 and above`);root.querySelector('.status').style.visibility=v>=90?'visible':'hidden';}function show(html){preview.innerHTML=html;preview.hidden=false;map.classList.add('expanded');}root.querySelector('.cultivate').onclick=()=>{state.condition=Math.min(100,state.condition+4);preview.hidden=true;map.classList.remove('expanded');render();};root.querySelector('.harvest').onclick=()=>{show(`<span>Yield tuning pending</span><button data-depth="9">Light · ${state.condition} → ${Math.max(0,state.condition-9)}</button><button data-depth="24">Hard · ${state.condition} → ${Math.max(0,state.condition-24)}</button>`);preview.querySelectorAll('button').forEach(b=>b.onclick=()=>{state.condition=Math.max(0,state.condition-Number(b.dataset.depth));preview.hidden=true;map.classList.remove('expanded');render();});};root.querySelector('.info').onclick=()=>show('Full panel: next design review.');render();if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addSlider(state,'condition',{label:'Condition',min:0,max:100,step:1});}})();
</script>
