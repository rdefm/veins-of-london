<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Vein — London</title>
<style>
/* ============================================================
   DESIGN TOKENS
   ============================================================ */
:root {
  --ink:       #1a1a1a;
  --paper:     #f0ece2;
  --amber:     #c8873a;
  --slate:     #4a5568;
  --muted:     #8a8a8a;
  --danger:    #9b2335;
  --success:   #3a7a52;
  --card-bg:   #faf8f3;
  --border:    #d4cfc4;
  --font-body: Georgia, 'Times New Roman', serif;
  --font-ui:   system-ui, -apple-system, sans-serif;
  --radius:    6px;
  --transition:0.28s ease;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #2a2a2a; display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; font-family: var(--font-body); }
#app { width: 100%; max-width: 390px; min-height: 100vh; background: var(--paper); position: relative; overflow: hidden; display: flex; flex-direction: column; }

/* ============================================================
   SHARED: HEADER
   ============================================================ */
.screen-header { background: var(--ink); padding: 14px 18px; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
.screen-header-back { background: none; border: none; color: var(--amber); font-size: 20px; cursor: pointer; padding: 0 4px 0 0; line-height: 1; }
.screen-header-titles { flex: 1; }
.screen-header-eyebrow { font-family: var(--font-ui); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--amber); font-weight: 600; margin-bottom: 2px; }
.screen-header-title { font-size: 20px; color: var(--paper); font-weight: normal; letter-spacing: -0.01em; }
.screen-header-sub { font-family: var(--font-ui); font-size: 11px; color: var(--muted); margin-top: 2px; }

/* ============================================================
   SHARED: BUTTONS
   ============================================================ */
.btn { font-family: var(--font-ui); font-size: 14px; font-weight: 600; padding: 13px 18px; border-radius: var(--radius); border: none; cursor: pointer; text-align: left; transition: background 0.15s ease, transform 0.1s ease; letter-spacing: 0.01em; line-height: 1.3; display: block; width: 100%; }
.btn:active { transform: scale(0.98); }
.btn-primary   { background: var(--ink);     color: var(--paper); }
.btn-danger    { background: var(--danger);  color: #fff; }
.btn-success   { background: var(--success); color: #fff; }
.btn-amber     { background: var(--amber);   color: var(--ink); }
.btn-secondary { background: transparent; color: var(--slate); border: 1px solid var(--border); font-weight: 500; }
.btn-primary:hover { background: #333; }
.btn:disabled  { opacity: 0.45; cursor: default; transform: none; }

/* ============================================================
   SHARED: ACTION BAR
   ============================================================ */
.action-bar { padding: 14px 18px 28px; background: var(--paper); border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; opacity: 0; transform: translateY(8px); transition: opacity 0.3s ease 0.1s, transform 0.3s ease 0.1s; }
.action-bar.visible { opacity: 1; transform: translateY(0); }
/* event-screen action bar in normal flow — card area overflow:hidden keeps it in place */

/* ============================================================
   SHARED: LABELS, CARDS, MISC
   ============================================================ */
.section-label { font-family: var(--font-ui); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-bottom: 8px; }
.card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
.card + .card { margin-top: 8px; }
.action-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; cursor: pointer; transition: background 0.15s ease, transform 0.1s ease; display: flex; align-items: center; justify-content: space-between; }
.action-card:active { transform: scale(0.99); background: #ede9df; }
.action-card-left { flex: 1; }
.action-card-title { font-family: var(--font-ui); font-size: 14px; font-weight: 600; color: var(--ink); margin-bottom: 3px; }
.action-card-sub { font-family: var(--font-ui); font-size: 12px; color: var(--muted); }
.action-card-arrow { color: var(--muted); font-size: 18px; margin-left: 10px; }
.action-card.disabled { opacity: 0.45; cursor: default; }
.action-card.disabled:active { transform: none; background: var(--card-bg); }
.pill { display: inline-block; font-family: var(--font-ui); font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 20px; }
.pill-amber { background: #fdf0e0; color: var(--amber); border: 1px solid #f0d4a0; }
.pill-success { background: #e8f5ee; color: var(--success); border: 1px solid #b8d8c4; }
.pill-danger  { background: #fdf0f0; color: var(--danger); border: 1px solid #e8c4c4; }

/* ============================================================
   SHARED: MODAL
   ============================================================ */
.modal-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.55); display: flex; align-items: flex-end; justify-content: center; z-index: 100; animation: fadeIn 0.2s ease; }
.modal { background: var(--paper); border-radius: 12px 12px 0 0; width: 100%; padding: 20px 18px 32px; animation: slideUp 0.25s ease; max-height: 85vh; overflow-y: auto; }
.modal-title { font-size: 20px; color: var(--ink); margin-bottom: 6px; font-weight: normal; }
.modal-sub { font-family: var(--font-ui); font-size: 13px; color: var(--muted); margin-bottom: 16px; line-height: 1.5; }
.modal-actions { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
@keyframes fadeIn  { from { opacity: 0; }                        to { opacity: 1; } }
@keyframes slideUp { from { transform: translateY(40px); opacity:0; } to { transform:translateY(0); opacity:1; } }
@keyframes screenFadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

/* ============================================================
   SHARED: HP / XP BARS
   ============================================================ */
.bar-wrap { background: var(--border); border-radius: 4px; height: 6px; overflow: hidden; margin-top: 4px; }
.bar-fill { height: 100%; border-radius: 4px; transition: width 0.4s ease; }
.bar-fill.hp    { background: var(--success); }
.bar-fill.hp.low { background: var(--danger); }
.bar-fill.xp    { background: var(--amber); }
.dev-bar-wrap { background: var(--border); border-radius: 4px; height: 8px; overflow: hidden; margin-top: 4px; }
.dev-bar-fill { height: 100%; border-radius: 4px; background: var(--success); transition: width 0.4s ease; }
.dev-bar-fill.almost { background: var(--amber); }

/* ============================================================
   TITLE SCREEN
   ============================================================ */
.title-screen { flex: 1; display: flex; flex-direction: column; justify-content: space-between; background: var(--ink); }
.title-hero { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 48px 28px 32px; }
.title-eyebrow { font-family: var(--font-ui); font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--amber); font-weight: 600; margin-bottom: 12px; }
.title-word { font-size: 72px; color: var(--paper); letter-spacing: -0.03em; line-height: 0.9; font-weight: normal; margin-bottom: 20px; }
.title-tagline { font-family: var(--font-ui); font-size: 13px; color: var(--muted); line-height: 1.6; max-width: 260px; }
.title-starts { padding: 24px 20px 40px; display: flex; flex-direction: column; gap: 10px; border-top: 1px solid #333; }
.title-start-btn { font-family: var(--font-ui); font-size: 14px; font-weight: 600; padding: 15px 18px; border-radius: var(--radius); border: none; cursor: pointer; text-align: left; transition: background 0.15s ease, transform 0.1s ease; display: flex; align-items: center; justify-content: space-between; }
.title-start-btn:active { transform: scale(0.98); }
.title-start-main  { background: var(--amber); color: var(--ink); }
.title-start-debug { background: #2a2a2a; color: var(--muted); border: 1px solid #444; }
.title-start-label { font-size: 11px; font-weight: 400; opacity: 0.7; margin-top: 2px; display: block; }
.title-version { font-family: var(--font-ui); font-size: 10px; color: #444; padding: 0 20px 12px; }

/* ============================================================
   EVENT CARD SCREEN
   ============================================================ */
.event-screen { flex: 1; display: flex; flex-direction: column; }
.event-header { background: var(--ink); color: var(--paper); padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; }
.event-header-title { font-family: var(--font-ui); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--amber); font-weight: 600; }
.event-header-time  { font-family: var(--font-ui); font-size: 11px; color: var(--muted); letter-spacing: 0.06em; }
.event-card-area {
  flex: 1;
  padding: 14px 18px;
  display: flex;
  flex-direction: column;
  justify-content: flex-end; /* cards anchor to bottom */
  overflow: hidden;           /* old cards pushed off the top, no scroll */
  gap: 10px;
}
.event-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 18px 16px; opacity: 0; transform: translateY(12px); transition: opacity var(--transition), transform var(--transition); }
.event-card.visible { opacity: 1; transform: translateY(0); }
.event-card-label { font-family: var(--font-ui); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--amber); font-weight: 700; margin-bottom: 10px; }
.event-card-text  { font-size: 15px; line-height: 1.65; color: var(--ink); }
.event-card-text em { font-style: italic; color: var(--slate); }
.event-card.speaker { border-left: 3px solid var(--amber); background: #fffdf6; }
.event-card.speaker .speaker-name { font-family: var(--font-ui); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--amber); margin-bottom: 6px; }
.event-card.speaker .event-card-text { font-size: 14.5px; color: var(--slate); }
.event-card.tension    { background: #fdf5f5; border-color: #e8c4c4; }
.event-card.tension .event-card-label { color: var(--danger); }
.event-card.resolution { background: #f5f9f5; border-color: #b8d4b8; }
.event-card.craft { background: #f5f5fd; border-color: #c4c4e8; }
.event-card.craft .event-card-label { color: #5a5aaa; }
.progress-dots { display: flex; gap: 5px; justify-content: center; padding: 10px 0 0; }
.dot { width: 5px; height: 5px; border-radius: 50%; background: var(--border); transition: background 0.2s ease; }
.dot.active { background: var(--amber); }

/* ============================================================
   HOME SCREEN
   ============================================================ */
.home-screen { flex: 1; display: flex; flex-direction: column; }
.home-header { background: var(--ink); padding: 16px 20px 14px; }
.home-header-city  { font-family: var(--font-ui); font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--amber); font-weight: 600; margin-bottom: 4px; }
.home-header-title { font-size: 26px; color: var(--paper); letter-spacing: -0.01em; font-weight: normal; }
.home-header-sub   { font-family: var(--font-ui); font-size: 12px; color: var(--muted); margin-top: 4px; }
.home-body { flex: 1; padding: 18px 18px 10px; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; }
.stat-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.stat-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; }
.stat-label { font-family: var(--font-ui); font-size: 9px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); margin-bottom: 4px; }
.stat-value { font-size: 18px; color: var(--ink); letter-spacing: -0.02em; }
.stat-value span { font-family: var(--font-ui); font-size: 11px; color: var(--muted); }
.time-bar { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; }
.time-block { display: flex; flex-direction: column; align-items: center; gap: 5px; }
.time-block-label { font-family: var(--font-ui); font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
.time-block-indicator { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--border); background: var(--paper); transition: background 0.2s ease, border-color 0.2s ease; }
.time-block-indicator.current { background: var(--amber); border-color: var(--amber); }
.time-block-indicator.past    { background: var(--ink);   border-color: var(--ink); }
.home-nav { background: var(--ink); padding: 10px 0 20px; display: flex; justify-content: space-around; flex-shrink: 0; }
.global-nav { background: var(--ink); padding: 10px 0 20px; display: flex; justify-content: space-around; flex-shrink: 0; width: 100%; max-width: 390px; position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); z-index: 50; }
.global-nav-spacer { height: 74px; flex-shrink: 0; } /* pushes content above fixed nav */
.nav-btn { display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: none; cursor: pointer; padding: 4px 14px; }
.nav-btn-icon  { font-size: 20px; }
.nav-btn-label { font-family: var(--font-ui); font-size: 10px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
.nav-btn.active .nav-btn-label { color: var(--amber); }
.nav-btn-badge { position: relative; }
.nav-btn-badge::after { content: ''; position: absolute; top: -2px; right: -2px; width: 7px; height: 7px; background: var(--amber); border-radius: 50%; border: 1px solid var(--ink); }
.tutorial-banner { background: #fffaed; border: 1px solid #e8d8a0; border-radius: var(--radius); padding: 12px 14px; font-family: var(--font-ui); font-size: 13px; color: var(--slate); line-height: 1.5; }
.tutorial-banner strong { color: var(--amber); font-weight: 700; }
.collapsible-stats { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.collapsible-stats-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; cursor: pointer; user-select: none; }
.collapsible-stats-title { font-family: var(--font-ui); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.collapsible-stats-arrow { font-size: 14px; color: var(--muted); transition: transform 0.2s ease; }
.collapsible-stats-arrow.open { transform: rotate(180deg); }
.collapsible-stats-body { padding: 0 16px 14px; display: flex; flex-direction: column; gap: 12px; }

.todo-card { background: #fdfbf2; border: 1px solid #e0d8b0; border-radius: var(--radius); padding: 14px 16px 12px; position: relative; box-shadow: 2px 2px 6px rgba(0,0,0,0.06); }
.todo-card::before { content: ''; position: absolute; top: 0; left: 22px; right: 22px; height: 2px; background: #e8d8a0; border-radius: 0 0 2px 2px; }
.todo-heading { font-family: Georgia, serif; font-size: 11px; letter-spacing: 0.08em; color: #b0945a; margin-bottom: 10px; text-transform: lowercase; font-style: italic; }
.todo-item { display: flex; align-items: flex-start; gap: 10px; padding: 5px 0; border-bottom: 1px dashed #e0d4a0; }
.todo-item:last-child { border-bottom: none; }
.todo-check { font-size: 15px; flex-shrink: 0; margin-top: 1px; }
.todo-text { font-family: Georgia, serif; font-size: 14px; color: #3a3020; line-height: 1.45; }
.todo-text.done { text-decoration: line-through; color: #aaa; }

/* ============================================================
   SEARCH RESULT
   ============================================================ */
.search-screen { flex: 1; display: flex; flex-direction: column; }
.search-body   { flex: 1; padding: 18px; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; }
.vein-found-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; animation: slideUp 0.3s ease; }
.vein-found-type { font-size: 28px; margin-bottom: 6px; }
.vein-found-name { font-size: 22px; color: var(--ink); font-weight: normal; margin-bottom: 4px; }
.vein-found-detail { font-family: var(--font-ui); font-size: 12px; color: var(--muted); line-height: 1.6; }
.vein-found-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
.vein-stat { background: var(--paper); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; }
.vein-stat-label { font-family: var(--font-ui); font-size: 9px; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); margin-bottom: 4px; }
.vein-stat-value { font-family: var(--font-ui); font-size: 16px; font-weight: 700; color: var(--ink); }
.guard-card { background: #fdf5f5; border: 1px solid #e8c4c4; border-radius: var(--radius); padding: 14px 16px; }
.guard-card-label { font-family: var(--font-ui); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--danger); font-weight: 700; margin-bottom: 6px; }
.guard-card-text  { font-family: var(--font-ui); font-size: 13px; color: var(--slate); line-height: 1.5; }

/* ============================================================
   VEINS SCREEN
   ============================================================ */
.veins-screen { flex: 1; display: flex; flex-direction: column; }
.veins-body   { flex: 1; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
.vein-list-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; cursor: pointer; transition: background 0.15s ease; }
.vein-list-card:active { background: #ede9df; }
.vein-list-card-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.vein-list-name  { font-size: 16px; color: var(--ink); }
.vein-list-level { font-family: var(--font-ui); font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: 0.05em; }
.vein-list-meta  { font-family: var(--font-ui); font-size: 12px; color: var(--muted); display: flex; gap: 12px; }
.vein-charge-bar  { background: var(--border); border-radius: 3px; height: 4px; overflow: hidden; margin-top: 8px; }
.vein-charge-fill { height: 100%; border-radius: 3px; background: var(--amber); transition: width 0.4s ease; }

/* ============================================================
   INVENTORY SCREEN
   ============================================================ */
.inventory-screen { flex: 1; display: flex; flex-direction: column; }
.inventory-body   { flex: 1; overflow-y: auto; }
.inv-tabs { display: flex; background: var(--ink); border-bottom: 1px solid #333; }
.inv-tab  { flex: 1; padding: 10px 4px; font-family: var(--font-ui); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); background: none; border: none; cursor: pointer; transition: color 0.15s ease; border-bottom: 2px solid transparent; }
.inv-tab.active { color: var(--amber); border-bottom-color: var(--amber); }
.inv-section { padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
.inv-empty { font-family: var(--font-ui); font-size: 13px; color: var(--muted); text-align: center; padding: 28px 16px; line-height: 1.6; }
.ore-row { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; display: flex; align-items: center; gap: 12px; }
.ore-row-symbol { font-size: 22px; width: 32px; text-align: center; }
.ore-row-info { flex: 1; }
.ore-row-name  { font-family: var(--font-ui); font-size: 13px; font-weight: 600; color: var(--ink); margin-bottom: 1px; }
.ore-row-sub   { font-family: var(--font-ui); font-size: 11px; color: var(--muted); }
.ore-row-qty   { font-size: 20px; color: var(--ink); letter-spacing: -0.02em; font-family: var(--font-ui); font-weight: 700; }
.item-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; cursor: pointer; transition: background 0.15s ease; }
.item-card:active { background: #ede9df; }
.item-card.equipped { border-color: var(--amber); background: #fffdf6; }
.item-card-top { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.item-card-icon { font-size: 22px; }
.item-card-name { font-family: var(--font-ui); font-size: 14px; font-weight: 600; color: var(--ink); }
.item-card-desc { font-family: var(--font-ui); font-size: 12px; color: var(--muted); line-height: 1.5; }
.item-card-stats { display: flex; gap: 8px; margin-top: 8px; }

/* ============================================================
   HOME PROPERTY SCREEN
   ============================================================ */
.property-screen { flex:1; display:flex; flex-direction:column; }
.property-body   { flex:1; padding:16px 18px; display:flex; flex-direction:column; gap:14px; overflow-y:auto; }
.property-tier   { background:var(--ink); border-radius:var(--radius); padding:16px; color:var(--paper); }
.property-tier-name { font-size:22px; font-weight:normal; margin-bottom:4px; }
.property-tier-desc { font-family:var(--font-ui); font-size:12px; color:var(--muted); line-height:1.5; margin-top:6px; }
.property-tier-meta { font-family:var(--font-ui); font-size:11px; color:var(--amber); margin-top:8px; }
.upgrade-row  { background:var(--card-bg); border:1px solid var(--border); border-radius:var(--radius); padding:13px 16px; display:flex; align-items:center; justify-content:space-between; }
.upgrade-row-info { flex:1; }
.upgrade-row-name { font-family:var(--font-ui); font-size:13px; font-weight:600; color:var(--ink); margin-bottom:2px; }
.upgrade-row-desc { font-family:var(--font-ui); font-size:11px; color:var(--muted); line-height:1.4; }
.upgrade-row-cost { font-family:var(--font-ui); font-size:13px; font-weight:700; color:var(--amber); white-space:nowrap; margin-left:12px; }
.upgrade-row.installed .upgrade-row-name { color:var(--success); }
.upgrade-row.installed .upgrade-row-cost { color:var(--success); font-size:11px; }

/* ============================================================
   FACTIONS SCREEN
   ============================================================ */
.factions-screen { flex:1; display:flex; flex-direction:column; }
.factions-body   { flex:1; padding:16px 18px; display:flex; flex-direction:column; gap:12px; overflow-y:auto; }
.faction-card    { background:var(--card-bg); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; cursor:pointer; transition:background 0.15s ease; }
.faction-card:active { background:#ede9df; }
.faction-card-top { padding:13px 16px 10px; display:flex; align-items:center; gap:10px; }
.faction-dot   { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
.faction-name  { font-size:16px; color:var(--ink); font-weight:normal; flex:1; }

/* ============================================================

.barometer-state-label   { font-family:var(--font-ui); font-size:14px; font-weight:600; color:var(--ink); }

.save-slot-name { font-family: var(--font-ui); font-size: 13px; font-weight: 600; color: var(--ink); margin-bottom: 2px; }
.save-slot-meta { font-family: var(--font-ui); font-size: 11px; color: var(--muted); }
.save-slot-actions { display: flex; gap: 6px; }
.save-slot-btn { font-family: var(--font-ui); font-size: 12px; font-weight: 600; padding: 6px 11px; border-radius: var(--radius); border: none; cursor: pointer; }
.save-slot-btn.load   { background: var(--ink); color: var(--paper); }
.save-slot-btn.del    { background: transparent; color: var(--danger); border: 1px solid #e8c4c4; }
.save-slot-btn.save   { background: var(--amber); color: var(--ink); }
.save-note { font-family: var(--font-ui); font-size: 11px; color: var(--muted); text-align: center; padding: 8px 16px; line-height: 1.5; }
textarea.save-export { width: 100%; height: 120px; font-family: monospace; font-size: 11px; background: var(--ink); color: #7ab; border: 1px solid #444; border-radius: var(--radius); padding: 10px; resize: none; outline: none; }

/* ============================================================
   STATS SCREEN
   ============================================================ */

.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stats-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; }

.contact-card-header { padding: 14px 16px 10px; display: flex; align-items: center; gap: 12px; }

.contact-name { font-size: 16px; color: var(--ink); font-weight: normal; margin-bottom: 2px; }
.contact-role { font-family: var(--font-ui); font-size: 11px; color: var(--muted); }
.contact-actions { border-top: 1px solid var(--border); }
.contact-action { padding: 12px 16px; font-family: var(--font-ui); font-size: 13px; color: var(--slate); cursor: pointer; display: flex; align-items: center; justify-content: space-between; transition: background 0.12s ease; border-bottom: 1px solid var(--border); }

.contact-action:active { background: #ede9df; }

.contact-action.locked:active { background: transparent; }
.contact-action-arrow { color: var(--muted); }
.contact-lock-reason  { font-size: 11px; color: var(--muted); }

   SMS SCREEN
   ============================================================ */
.sms-screen { flex: 1; display: flex; flex-direction: column; background: #e5e5ea; }

/* ============================================================
   CRAFTING SCREEN
   ============================================================ */
.crafting-screen { flex: 1; display: flex; flex-direction: column; }

.recipe-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.recipe-card-header { padding: 14px 16px 10px; display: flex; align-items: center; justify-content: space-between; }
.recipe-name { font-size: 17px; color: var(--ink); font-weight: normal; }
.recipe-body { padding: 0 16px 14px; }
.recipe-desc { font-family: var(--font-ui); font-size: 12px; color: var(--muted); line-height: 1.5; margin-bottom: 10px; }
.recipe-ingredients { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
.recipe-ingredient { font-family: var(--font-ui); font-size: 13px; display: flex; justify-content: space-between; align-items: center; }
.recipe-ingredient-name { color: var(--slate); }
.recipe-ingredient-qty  { font-weight: 700; }
.recipe-ingredient-qty.ok      { color: var(--success); }
.recipe-ingredient-qty.missing { color: var(--danger); }
.skill-bar-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
.skill-bar-label { font-family: var(--font-ui); font-size: 11px; color: var(--muted); }
.skill-bar-value { font-family: var(--font-ui); font-size: 11px; font-weight: 700; color: var(--amber); }

/* ============================================================
   COMBAT SCREEN
   ============================================================ */
.combat-screen { flex: 1; display: flex; flex-direction: column; }
.combat-body   { flex: 1; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
.combatant-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
.combatant-card.enemy { background: #fdf5f5; border-color: #e8c4c4; }
.combatant-name   { font-family: var(--font-ui); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 4px; }
.combatant-hp     { font-size: 18px; color: var(--ink); }
.combatant-status { font-family: var(--font-ui); font-size: 11px; color: var(--amber); margin-top: 3px; }
.combat-log { background: var(--ink); border-radius: var(--radius); padding: 12px 14px; max-height: 130px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
.combat-log-line { font-family: var(--font-ui); font-size: 12px; color: #aaa; line-height: 1.4; }
.combat-log-line.player-hit { color: var(--amber); }
.combat-log-line.enemy-hit  { color: #e08080; }
.combat-log-line.info       { color: #7ab; }
.combat-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 14px 18px 28px; border-top: 1px solid var(--border); flex-shrink: 0; }
.combat-actions .btn { font-size: 13px; padding: 12px 10px; text-align: center; }

.screen-fade-enter { animation: screenFadeIn 0.3s ease forwards; }
</style>

<div id="app"></div>
<script>
// ============================================================

const CRAFTING_XP_LEVELS = [0, 0, 80, 220, 500, 1000]; // index = level

// Device XP thresholds — level up = +1 charge per day
const DEVICE_XP_LEVELS = [0, 0, 50, 150, 400, 1000]; // index = level

// Devices — craftable equipment using orichalchum
const DEVICE_TYPES = {

    id:          'timeDevice',
    name:        'Time Device',

    unlockFlag:  'craftingUnlocked',

// Equippable items
const ITEMS = {
  crowbar: {
    id:          'crowbar',
    name:        'Crowbar',
    symbol:      '🔧',
    slot:        'weapon',

    attackBonus: { min: 4, max: 8 },

const ARCHIE_ORE_GOAL = 10;

// ── HOME TIERS ───────────────────────────────────────────────
const HOME_TIERS = {

const HOME_SECURITY = {

const HOME_ROOMS = {
  workshop:    { id:'workshop',    name:'Workshop',        cost:800,   minTier:'flat',      bonus:'crafting', bonusValue:0.08, description:`Bench, tools, decent lighting. Slightly increases crafting success chance.` },

// ── FACTIONS ─────────────────────────────────────────────────
const FACTIONS = {

// === REST SYSTEM ===
function doRest() {
  // Advance through remaining time blocks for the day, then to next morning
  const b = gameState.world;
  const blocksLeft = TIME_BLOCKS.length - b.timeBlocksDone.length;
  if (blocksLeft > 0) {
    // Use all remaining blocks
    for (let i = 0; i < blocksLeft; i++) {
      b.timeBlocksDone.push(b.timeBlock);
      b.blocksSinceReset++;
      b.timeBlock++;
    }
  }
  // Tick over to next day
  b.day++;
  b.timeBlock = 0;
  b.timeBlocksDone = [];
  dailyTick();
  // Heal player — rest recovers 20% of max HP
  const healAmount = Math.round(gameState.player.hpMax * 0.2);
  gameState.player.hp = Math.min(gameState.player.hpMax, gameState.player.hp + healAmount);
  if (healAmount > 0 && gameState.player.hp < gameState.player.hpMax + healAmount) {
    pushNotification(`Rested. Day ${gameState.world.day}. +${healAmount} HP.`);
  }
  renderGame();
}

// === BAROMETER SYSTEM ===
function getBarometerEffects() {
  // Merge all active state effects
  const merged = {};
  ['economic','social','political'].forEach(section => {
    const state = gameState.barometer[section];
    const effects = BAROMETER_STATES[section][state]?.effects || {};
    Object.entries(effects).forEach(([k,v]) => { merged[k] = (merged[k]||0) + v; });
  });
  return merged;
}

function getEffectiveMugChance(base) {
  const fx = getBarometerEffects();
  return Math.max(0, Math.min(0.8, base + (fx.mugChance||0)));
}

function getEffectiveOrePrice(type, base) {
  const fx = getBarometerEffects();
  let mult = 1 + (fx.orePrice||0);
  if (type==='void'   && fx.voidPremium)    mult += fx.voidPremium;
  if (type==='time'   && fx.timePremium)    mult += fx.timePremium;
  if (type==='energy' && fx.energyPremium)  mult += fx.energyPremium;
  if (type==='motion' && fx.motionPremium)  mult += fx.motionPremium;
  return Math.round(base * Math.max(0.1, mult));
}



// === BAROMETER SYSTEM ===
function initBarometerProgress() {
  const bp = {}; const bc = {};
  ['economic','social','political'].forEach(sec => {
    bp[sec] = {}; bc[sec] = {};
    Object.keys(BAROMETER_STATES[sec]).forEach(sid => {
      bp[sec][sid] = sid === gameState.barometer[sec] ? 100 : 0;
      bc[sec][sid] = { push:0, pull:0 };
    });
  });
  gameState.barometerProgress  = bp;
  gameState.barometerCooldowns = bc;
}
function ensureBarometerInit() {
  if (!gameState.barometerProgress) initBarometerProgress();
}
function resolveBarometerSection(sec) {
  const bp = gameState.barometerProgress[sec];
  const active = gameState.barometer[sec];
  // Clamp all first
  Object.keys(bp).forEach(id => { bp[id] = Math.max(0, Math.min(100, bp[id])); });
  // Any non-active state hitting 100 triggers transition
  const winner = Object.keys(bp).find(id => id !== active && bp[id] >= 100);
  if (winner) {
    bp[active] = 0;
    gameState.barometer[sec] = winner;
    bp[winner] = 100;
    const newState = BAROMETER_STATES[sec][winner];
    pushNotification(`${sec.charAt(0).toUpperCase()+sec.slice(1)} shift: ${newState.label}. ${newState.description}`);
  }
}
function tickFactionBarometerNudges() {
  ensureBarometerInit();
  Object.entries(FACTION_BAROMETER_PREFS).forEach(([,prefs]) => {
    prefs.forEach(p => {
      const bp = gameState.barometerProgress[p.section];
      if (!bp) return;
      if (p.direction === 'push') bp[p.state] = Math.min(100, (bp[p.state]||0) + p.strength);
      else                        bp[p.state] = Math.max(0,   (bp[p.state]||0) - p.strength);
    });
  });
  ['economic','social','political'].forEach(resolveBarometerSection);
}
function tickBarometer(day) {
  ensureBarometerInit();
  tickFactionBarometerNudges();
  // Slow organic drift: 20% chance per non-active state of +1 per day
  ['economic','social','political'].forEach(sec => {
    const active = gameState.barometer[sec];
    Object.keys(BAROMETER_STATES[sec]).forEach(sid => {
      if (sid === active) return;
      if (Math.random() < 0.20) gameState.barometerProgress[sec][sid] = Math.min(99, (gameState.barometerProgress[sec][sid]||0)+1);
    });
    resolveBarometerSection(sec);
  });
  gameState.barometer.lastShift = gameState.barometer.lastShift || { economic:0, social:0, political:0 };
}
function pushBarometerState(section, stateId) {
  ensureBarometerInit();
  const day = gameState.world.day;
  const cd  = gameState.barometerCooldowns[section][stateId];
  if (gameState.player.cash < 2000 || day <= cd.push) return;
  gameState.player.cash -= 2000;
  cd.push = day;
  gameState.barometerProgress[section][stateId] = Math.min(100,(gameState.barometerProgress[section][stateId]||0)+20);
  resolveBarometerSection(section);
  renderGame();
}
function pullBarometerState(section, stateId) {
  ensureBarometerInit();
  const day = gameState.world.day;
  const cd  = gameState.barometerCooldowns[section][stateId];
  if (gameState.player.cash < 2000 || day <= cd.pull) return;
  gameState.player.cash -= 2000;
  cd.pull = day;
  gameState.barometerProgress[section][stateId] = Math.max(0,(gameState.barometerProgress[section][stateId]||0)-20);
  renderGame();
}

// === HOME SYSTEM ===
function getHomeTier()   { return HOME_TIERS[gameState.home.tier]; }
function getNextTier()   { const tiers=Object.keys(HOME_TIERS); const i=tiers.indexOf(gameState.home.tier); return tiers[i+1]?HOME_TIERS[tiers[i+1]]:null; }
function getHomeRaidChance() {
  const tier = getHomeTier();
  const fx   = getBarometerEffects();
  let chance = tier.raidBaseChance + (fx.homeRaid||0);
  // Security reduces chance
  gameState.home.security.forEach(sid => { chance -= HOME_SECURITY[sid]?.raidReduction||0; });
  // More ore = more attractive
  const stored = Object.values(gameState.home.storedOre||{}).reduce((s,v)=>s+v,0);
  chance += stored * 0.001;
  return Math.max(0.002, chance);
}
function upgradeHome() {
  const next = getNextTier();
  if (!next || gameState.player.cash < next.upgradeCost) return;
  gameState.player.cash -= next.upgradeCost;
  gameState.home.tier = next.id;
  closeModal(); renderGame();
}
function addHomeSecurity(sid) {
  if (gameState.home.security.includes(sid)) return;
  const sec = HOME_SECURITY[sid];
  if (!sec || gameState.player.cash < sec.cost) return;
  const tier = getHomeTier();
  if (gameState.home.security.length >= tier.maxSecuritySlots) return;
  gameState.player.cash -= sec.cost;
  gameState.home.security.push(sid);
  closeModal(); renderGame();
}
function addHomeRoom(rid) {
  if (gameState.home.rooms.includes(rid)) return;
  const room = HOME_ROOMS[rid];
  if (!room) return;
  const tier = getHomeTier();
  const tierOrder = Object.keys(HOME_TIERS);
  if (tierOrder.indexOf(tier.id) < tierOrder.indexOf(room.minTier)) return;
  if (gameState.home.rooms.length >= tier.maxRooms) return;
  if (gameState.player.cash < room.cost) return;
  gameState.player.cash -= room.cost;
  gameState.home.rooms.push(rid);
  // Apply stat bonuses immediately
  if (room.bonus === 'body') {
    gameState.player.hpMax += room.bonusValue;
    gameState.player.hp    = Math.min(gameState.player.hp + room.bonusValue, gameState.player.hpMax);
  }
  closeModal(); renderGame();
}
function rollHomeRaid(day) {
  if (day - (gameState.home.lastRaidDay||0) < 3) return; // minimum 3 days between raids
  const chance = getHomeRaidChance();
  if (Math.random() > chance) return;
  gameState.home.lastRaidDay = day;
  const stored = gameState.home.storedOre||{};
  const total  = Object.values(stored).reduce((s,v)=>s+v,0);
  if (total === 0) return;
  // Safe room halves loss
  const hasSafeRoom = gameState.home.rooms.includes('safeRoom');
  const lossRatio   = hasSafeRoom ? 0.25 : 0.50;
  let lost = 0;
  Object.keys(stored).forEach(k => {
    const take = Math.floor((stored[k]||0) * lossRatio);
    stored[k] -= take; lost += take;
  });
  if (lost > 0) pushNotification(`Your home was raided overnight. ${lost} units of stored ore taken.`);
}

// === FACTION SYSTEM ===
function getFactionRelation(fid) { return gameState.factions[fid]?.relation||0; }
function canJoinFaction(fid)     { return getFactionRelation(fid) >= FACTIONS[fid].joinRelation && !gameState.factions[fid]?.joined; }
function joinFaction(fid) {
  if (!canJoinFaction(fid)) return;
  gameState.factions[fid].joined = true;
  pushNotification(`You've joined ${FACTIONS[fid].name}.`);
  closeModal(); renderGame();
}
function getWorkshopBonus() {
  // Sum crafting bonuses from rooms
  let bonus = 0;
  gameState.home.rooms.forEach(rid => {
    const r = HOME_ROOMS[rid];
    if (r && r.bonus === 'crafting') bonus += r.bonusValue;
  });
  return bonus;
}

// === DAILY TICK (recharge + lifespan + living costs) ===
function dailyTick() {
  const day = gameState.world.day;
  tickBarometer(day);
  rollHomeRaid(day);
  const fx = getBarometerEffects();
  const DAILY_COST = Math.round(50 * (1 + (fx.dailyCost||0)));
  gameState.player.cash = Math.max(0, gameState.player.cash - DAILY_COST);
  pushNotification('Day ' + day + ': -£' + DAILY_COST + ' living costs.' + (gameState.player.cash === 0 ? ' You are flat broke.' : ''));
  const expired = [];
  gameState.player.veins = gameState.player.veins.filter(v => {
    const ld = VEIN_LEVELS[v.level];
    if (v.chargeBlocks < ld.rechargeBlocks) v.chargeBlocks++;
    if (v.chargeBlocks >= ld.rechargeBlocks) v.charged = true;
    const age = day - (v.claimedOnDay || day);
    if (age >= ld.lifespanDays) { expired.push(v); return false; }
    return true;
  });
  // Day 2: trigger buyer event (Archie texts in the morning)
  if (gameState.flags.tutorialStage === 'buyer_event' && !gameState.flags.buyerEventSeen && day >= 2) {
    pushNotification('Archie texted. He\'s lined up the new buyer. Check Contacts.');
  }
  // Unlock archie craft chat one day after craft event
  if (gameState.flags.tutorialStage === 'archie_craft_chat' &&
      gameState.world._archieChatUnlockDay &&
      day >= gameState.world._archieChatUnlockDay) {
    pushNotification('Archie wants to meet up. Check Contacts.');
  }
  expired.forEach(v => {
    const ore = ORE_TYPES[v.oreType];
    pushNotification('Your ' + ore.name + ' vein on ' + v.location.split(',')[0] + ' has dried up and disappeared.');
  });
  // Process rooms
  if (gameState.home.rooms.includes('lab'))        processLab();
  if (gameState.home.rooms.includes('veinStation')) processVeinStation();
  // Reset device charges
  resetDeviceCharges();
}

// === CULTIVATING SYSTEM ===

function getCultivatingSuccessChance() {
  const sk = gameState.player.cultivatingSkill;
  return Math.min(0.90, 0.30 + (sk - 1) * 0.12);
}

function getCultivatingBarGain() {
  const sk = gameState.player.cultivatingSkill;
  return 1 + sk;
}

function awardCultivatingXP(amount) {
  const p = gameState.player;
  p.cultivatingXP = (p.cultivatingXP || 0) + amount;
  const maxLevel = CULTIVATING_XP_LEVELS.length - 1;
  while (p.cultivatingSkill < maxLevel && p.cultivatingXP >= CULTIVATING_XP_LEVELS[p.cultivatingSkill + 1]) {
    p.cultivatingSkill++;
    pushNotification(`Cultivating skill up — now level ${p.cultivatingSkill}.`);
  }
}

function attemptSeed(oreType) {
  const have = gameState.player.orichalchum[oreType] || 0;
  if (have < SEED_ORE_COST || isTimeExhausted()) return;
  advanceTimeBlock();
  gameState.player.orichalchum[oreType] = have - SEED_ORE_COST;
  const success = Math.random() < getCultivatingSuccessChance();
  if (success) {
    const ld = VEIN_LEVELS[1];
    const newVein = {
      id: makeVeinId(), oreType, level: 1, levelLabel: ld.label,
      devBar: getCultivatingBarGain(),
      charged: false, chargeBlocks: 0,
      claimed: true, npcClaimed: false,
      security: 'none', guards: 0, guardTemplate: null,
      location: generateLocationName(), claimedOnDay: gameState.world.day,
    };
    gameState.player.veins.push(newVein);
    awardCultivatingXP(30);
    openModal('seed_result', { success: true, oreType, veinId: newVein.id });
  } else {
    awardCultivatingXP(5);
    openModal('seed_result', { success: false, oreType });
  }
  renderGame();
}

function attemptCultivate(veinId) {
  if (isTimeExhausted()) return;
  const vein = gameState.player.veins.find(v => v.id === veinId);
  if (!vein) return;
  advanceTimeBlock();
  const success = Math.random() < getCultivatingSuccessChance();
  if (success) {
    const gain    = getCultivatingBarGain();
    const ld      = VEIN_LEVELS[vein.level];
    const prevBar = vein.devBar || 0;
    vein.devBar   = prevBar + gain;
    awardCultivatingXP(20);
    const levelledUp = vein.level < 5 && vein.devBar >= ld.devBarMax;
    if (levelledUp) levelUpVein(vein);
    openModal('cultivate_result', {
      success: true, gain, veinId, levelledUp,
      newLevel: vein.level, newLabel: vein.levelLabel,
    });
  } else {
    awardCultivatingXP(8);  // partial XP for failed attempt
    openModal('cultivate_result', { success: false, veinId });
  }
  renderGame();
}

function levelUpVein(vein) {
  if (vein.level >= 5) return;
  vein.level++;
  vein.levelLabel = VEIN_LEVELS[vein.level].label;
  vein.devBar = 0;
}

function levelDownVein(vein) {
  if (vein.level <= 1) {
    const ore = ORE_TYPES[vein.oreType];
    gameState.player.veins = gameState.player.veins.filter(v => v.id !== vein.id);
    pushNotification(`Your ${ore.name} vein on ${vein.location.split(',')[0]} collapsed and disappeared.`);
  } else {
    vein.level--;
    vein.levelLabel = VEIN_LEVELS[vein.level].label;
    vein.devBar = Math.floor(VEIN_LEVELS[vein.level].devBarMax * 0.8);
    pushNotification(`A vein on ${vein.location.split(',')[0]} dropped to level ${vein.level}.`);
  }
}

// === CRAFTING SYSTEM ===
function getCraftingSuccessChance(recipeKey) {
  const r = RECIPES[recipeKey]; const sk = gameState.player.craftingSkill;
  return Math.min(0.95, r.baseSuccess + (sk - 1) * 0.13 + getWorkshopBonus());
}
function getCraftingCalcCost(recipeKey) {
  const r = RECIPES[recipeKey]; const sk = gameState.player.craftingSkill;
  return Math.max(1, Math.round(r.baseCalcCost - (sk - 1) * 0.8));
}
function getCraftingEffectPower(recipeKey) {
  const r = RECIPES[recipeKey]; const sk = gameState.player.craftingSkill;
  return r.effectPower[sk] || 1;
}
function canCraft(recipeKey) {
  const r = RECIPES[recipeKey]; const cost = getCraftingCalcCost(recipeKey);
  return r.ingredients.every(ing => (gameState.player.orichalchum[ing.type]||0) >= cost);
}
function attemptCraft(recipeKey) {
  if (!canCraft(recipeKey)) return;
  const r = RECIPES[recipeKey]; const cost = getCraftingCalcCost(recipeKey);
  // Deduct calc regardless of outcome
  r.ingredients.forEach(ing => { gameState.player.orichalchum[ing.type] = Math.max(0,(gameState.player.orichalchum[ing.type]||0)-cost); });
  const success = Math.random() < getCraftingSuccessChance(recipeKey);
  if (success) {
    const power = getCraftingEffectPower(recipeKey);
    if (recipeKey === 'timePearl')    gameState.player.inventory.timePearl++;
    if (recipeKey === 'motionPowder') gameState.player.inventory.motionPowder = (gameState.player.inventory.motionPowder||0) + 1;
    if (recipeKey === 'rewind')       gameState.player.inventory.rewind       = (gameState.player.inventory.rewind||0) + 1;
    awardCraftingXP(r.xpReward);
    openModal('craft_result', { recipeKey, success:true, power });
  } else {
    awardCraftingXP(Math.floor(r.xpReward / 3)); // partial XP for failed attempt
    openModal('craft_result', { recipeKey, success:false, power:0 });
  }
  renderGame();
}
function awardCraftingXP(amount) {
  const p = gameState.player;
  p.craftingXP += amount;
  const maxLevel = CRAFTING_XP_LEVELS.length - 1;
  while (p.craftingSkill < maxLevel && p.craftingXP >= CRAFTING_XP_LEVELS[p.craftingSkill + 1]) {
    p.craftingSkill++;
  }
}

// === DEVICE SYSTEM ===
function getDeviceCalcCost(deviceType) {
  const dt = DEVICE_TYPES[deviceType];
  return getCraftingCalcCost(dt.recipeKey) * 2;
}
function canBuildDevice(deviceType) {
  const dt = DEVICE_TYPES[deviceType];
  const cost = getDeviceCalcCost(deviceType);
  return (gameState.player.orichalchum[dt.calcType]||0) >= cost;
}
function startDevice(deviceType) {
  if (!DEVICE_TYPES[deviceType]) return;
  gameState.player.devicesInProgress.push({ id:'dev_'+Date.now(), type:deviceType, progress:10 });
  renderGame();
}
function attemptDeviceBuild(deviceId) {
  const p      = gameState.player;
  const device = p.devicesInProgress.find(d => d.id === deviceId);
  if (!device) return;
  const dt   = DEVICE_TYPES[device.type];
  const cost = getDeviceCalcCost(device.type);
  if ((p.orichalchum[dt.calcType]||0) < cost) return;
  p.orichalchum[dt.calcType] -= cost;
  awardCraftingXP(Math.floor(RECIPES[dt.recipeKey].xpReward / 2));
  const success = Math.random() < getCraftingSuccessChance(dt.recipeKey);
  if (success) {
    device.progress = Math.min(100, device.progress + 5);
    if (device.progress >= 100) { completeDevice(device); return; }
  } else {
    device.progress = Math.max(0, device.progress - 2.5);
    if (device.progress <= 0) { breakDevice(deviceId); return; }
  }
  renderGame();
}
function completeDevice(device) {
  const p = gameState.player;
  p.devicesInProgress = p.devicesInProgress.filter(d => d.id !== device.id);
  p.devicesCompleted.push({ id:device.id, type:device.type, level:1, xp:0, chargesPerDay:1, chargesUsedToday:0, lastResetDay:gameState.world.day });
  const dt = DEVICE_TYPES[device.type];
  pushNotification(`${dt.name} complete. Check your equipment.`);
  renderGame();
}
function breakDevice(deviceId) {
  gameState.player.devicesInProgress = gameState.player.devicesInProgress.filter(d => d.id !== deviceId);
  pushNotification(`Device collapsed. The calc dispersed. You'll need to start again.`);
  renderGame();
}
function abandonDevice(deviceId) {
  gameState.player.devicesInProgress = gameState.player.devicesInProgress.filter(d => d.id !== deviceId);
  renderGame();
}
function equipDevice(deviceId) {
  gameState.player.equipment.device = deviceId;
  renderGame();
}
function unequipDevice() {
  gameState.player.equipment.device = null;
  renderGame();
}
function getDeviceChargesLeft(device) {
  return Math.max(0, device.chargesPerDay - (device.chargesUsedToday||0));
}
function resetDeviceCharges() {
  const day = gameState.world.day;
  (gameState.player.devicesCompleted||[]).forEach(d => {
    if ((d.lastResetDay||0) < day) { d.chargesUsedToday = 0; d.lastResetDay = day; }
  });
}
function awardDeviceXP(device, amount) {
  device.xp = (device.xp||0) + amount;
  const max = DEVICE_XP_LEVELS.length - 1;
  const dt  = DEVICE_TYPES[device.type];
  while (device.level < max && device.xp >= DEVICE_XP_LEVELS[device.level + 1]) {
    device.level++;
    device.chargesPerDay++;
    pushNotification(`${dt.name} levelled up — now ${device.chargesPerDay} charges per day.`);
  }
}
function combatUseDevice() {
  const p        = gameState.player;
  const deviceId = p.equipment.device;
  if (!deviceId) return;
  const device = p.devicesCompleted.find(d => d.id === deviceId);
  if (!device || getDeviceChargesLeft(device) <= 0) return;
  device.chargesUsedToday = (device.chargesUsedToday||0) + 1;
  awardDeviceXP(device, 10);
  const dt = DEVICE_TYPES[device.type];
  if (dt.effect === 'freeze') {
    const power = RECIPES['timePearl'].effectPower[p.craftingSkill] || 1;
    gameState.combat.frozenTurns += power;
    gameState.combat.log.push(`You activate the ${dt.name}. Enemy frozen for ${power} turn${power>1?'s':''}.`);
  } else if (dt.effect === 'motion') {
    const power = RECIPES['motionPowder'].effectPower[p.craftingSkill] || 1;
    gameState.combat.motionTurns += 2;
    gameState.combat.motionPower  = power;
    gameState.combat.log.push(`You activate the ${dt.name}. Movement accelerated.`);
  }
  closeModal();
  renderGame();
}

// === CONTACT RELATION SYSTEM ===
function awardRelation(contactId, amount) {

}
function canRecruit(contactId) {

}

// === CONTACT ROOM SYSTEM ===
function getContactInRoom(roomId) {
  // Returns contactId string or null
  const found = Object.entries(gameState.contacts).find(([,c]) => c.recruited && c.assignedRoom === roomId);
  return found ? found[0] : null;
}
function assignContactToRoom(contactId, roomId) {
  // Vacate the target room first
  Object.keys(gameState.contacts).forEach(cid => {

  });
  if (contactId !== 'none') gameState.contacts[contactId].assignedRoom = roomId;
  renderGame(); // modal is still open — re-render in place
}
function awardContactXP(contactId, skill, amount) {

  if (!c) return;
  const xpKey    = skill + 'XP';
  const skillKey = skill + 'Skill';
  const levels   = skill === 'crafting' ? CRAFTING_XP_LEVELS : CULTIVATING_XP_LEVELS;
  c[xpKey]   = (c[xpKey]   || 0) + amount;
  const max  = levels.length - 1;
  const name = contactId === 'archie' ? 'Archie' : 'James';

}

// === LAB SYSTEM ===
function adjustLabThreshold(recipeKey, delta) {
  if (!gameState.labThresholds) gameState.labThresholds = {};
  gameState.labThresholds[recipeKey] = Math.max(0, (gameState.labThresholds[recipeKey] || 0) + delta);
  renderGame();
}
function processLab() {
  const contactId = getContactInRoom('lab');
  if (!contactId) return;
  const c = gameState.contacts[contactId];
  const thresholds = gameState.labThresholds || {};
  let totalAttempts = 0; let totalSuccesses = 0;
  Object.keys(RECIPES).forEach(key => {
    if (key === 'timePearl'    && !gameState.flags.craftingUnlocked)    return;
    if (key === 'motionPowder' && !gameState.flags.motionPowderUnlocked) return;
    if (key === 'rewind'       && !gameState.flags.craftingUnlocked)    return;
    const target = thresholds[key] || 0;
    if (target === 0) return;
    const r = RECIPES[key];
    const sk = c.craftingSkill || 1;
    const cost = Math.max(1, Math.round(r.baseCalcCost - (sk - 1) * 0.8));
    const getInv = () => key === 'timePearl' ? (gameState.player.inventory.timePearl||0) : key === 'motionPowder' ? (gameState.player.inventory.motionPowder||0) : (gameState.player.inventory.rewind||0);
    const addInv = () => { if (key === 'timePearl') gameState.player.inventory.timePearl++; else if (key === 'motionPowder') gameState.player.inventory.motionPowder = (gameState.player.inventory.motionPowder||0)+1; else gameState.player.inventory.rewind = (gameState.player.inventory.rewind||0)+1; };
    while (getInv() < target) {
      const hasCalc = r.ingredients.every(ing => (gameState.player.orichalchum[ing.type]||0) >= cost);
      if (!hasCalc) break;
      r.ingredients.forEach(ing => { gameState.player.orichalchum[ing.type] = Math.max(0,(gameState.player.orichalchum[ing.type]||0)-cost); });
      const chance = Math.min(0.95, r.baseSuccess + (sk-1)*0.13 + getWorkshopBonus());
      const success = Math.random() < chance;
      if (success) { addInv(); awardContactXP(contactId,'crafting',r.xpReward); totalSuccesses++; }
      else           { awardContactXP(contactId,'crafting',Math.floor(r.xpReward/3)); }
      totalAttempts++;
    }
  });
  if (totalAttempts > 0) {
    const name = contactId === 'archie' ? 'Archie' : 'James';
    pushNotification(`Lab (${name}): ${totalSuccesses} crafted from ${totalAttempts} attempt${totalAttempts!==1?'s':''}.`);
  }
}

// === VEIN STATION SYSTEM ===
function toggleVeinStationVein(veinId) {
  if (!gameState.veinStationVeins) gameState.veinStationVeins = [];
  const idx = gameState.veinStationVeins.indexOf(veinId);
  if (idx >= 0) gameState.veinStationVeins.splice(idx, 1);
  else gameState.veinStationVeins.push(veinId);
  renderGame();
}
function processVeinStation() {
  const contactId = getContactInRoom('veinStation');
  if (!contactId) return;
  const c = gameState.contacts[contactId];
  const veinIds = gameState.veinStationVeins || [];
  let totalHarvested = 0; let totalCultivated = 0;
  const harvestBreakdown = {};
  veinIds.forEach(vid => {
    const vein = gameState.player.veins.find(v => v.id === vid);
    if (!vein) return;
    const ld = VEIN_LEVELS[vein.level];
    if (vein.charged) {
      const [mn,mx] = ld.yieldCautious;
      const yld = rand(mn, mx);
      gameState.player.orichalchum[vein.oreType] = (gameState.player.orichalchum[vein.oreType]||0) + yld;
      vein.charged = false; vein.chargeBlocks = 0;
      totalHarvested += yld;
      harvestBreakdown[vein.oreType] = (harvestBreakdown[vein.oreType]||0) + yld;
      awardContactXP(contactId,'cultivating',15);
    } else {
      const sk = c.cultivatingSkill || 1;
      const success = Math.random() < Math.min(0.90, 0.30 + (sk-1)*0.12);
      if (success) {
        vein.devBar = (vein.devBar||0) + (1+sk);
        if (vein.devBar >= ld.devBarMax && vein.level < 5) levelUpVein(vein);
        awardContactXP(contactId,'cultivating',20);
        totalCultivated++;
      } else {
        awardContactXP(contactId,'cultivating',8);
      }
    }
  });
  if (totalHarvested > 0 || totalCultivated > 0) {
    const name = contactId === 'archie' ? 'Archie' : 'James';
    const msgs = [];
    if (totalHarvested > 0) {
      const bd = Object.entries(harvestBreakdown).map(([t,v])=>`${v} ${ORE_TYPES[t].name}`).join(', ');
      msgs.push(`harvested ${bd}`);
    }
    if (totalCultivated > 0) msgs.push(`cultivated ${totalCultivated} vein${totalCultivated!==1?'s':''}`);
    pushNotification(`Vein Station (${name}): ${msgs.join('; ')}.`);
  }
}

// === JAMES CRAFTING JOB SYSTEM ===
function generateJamesJob() {
  const trust = gameState.contacts.james.relation || 0;
  const recipes = ['timePearl'];
  if (gameState.flags.motionPowderUnlocked) recipes.push('motionPowder');
  const recipeKey = randFrom(recipes);
  const recipe    = RECIPES[recipeKey];
  // Size scales with trust: trust 0-1=1-3, trust 2-3=3-6, trust 4+=5-10
  const minQty = trust <= 1 ? 1 : trust <= 3 ? 3 : 5;
  const maxQty = trust <= 1 ? 3 : trust <= 3 ? 6 : 10;
  const qty    = rand(minQty, maxQty);
  const payPerItem = CONSUMABLE_PRICES[recipeKey];
  return { recipeKey, recipeName: recipe.name, symbol: recipe.symbol, qty, payPerItem, totalPay: payPerItem * qty };
}

function getAttackRange() {

  let min = p.attackMin, max = p.attackMax;
  if (p.equipment.weapon) {

    if (itemObj) {
      const def = ITEMS[itemObj.type];
      if (def) { min += def.attackBonus.min; max += def.attackBonus.max; }
    }
  }
  return { min, max };
}

function executeSale(items) {
  // items = [{ kind:'ore', type:'time', qty:3 }, { kind:'consumable', type:'timePearl', qty:1 }]
  if (!items || items.length === 0) { closeModal(); return; }
  let gross = 0;
  let consSold = 0;
  items.forEach(item => {
    if (item.kind === 'ore') {
      const pricePerUnit = getEffectiveOrePrice(item.type, ORE_TYPES[item.type]?.basePrice||8);
      gross += pricePerUnit * item.qty;
      gameState.player.orichalchum[item.type] = Math.max(0, (gameState.player.orichalchum[item.type]||0) - item.qty);
    } else if (item.kind === 'consumable') {
      const pricePerUnit = CONSUMABLE_PRICES[item.type] || 30;
      gross += pricePerUnit * item.qty;
      consSold += item.qty;
      if (item.type === 'timePearl')    gameState.player.inventory.timePearl    = Math.max(0, gameState.player.inventory.timePearl    - item.qty);
      if (item.type === 'motionPowder') gameState.player.inventory.motionPowder = Math.max(0, gameState.player.inventory.motionPowder - item.qty);
    }
  });
  if (consSold > 0) {
    gameState.flags.consSoldCount = (gameState.flags.consSoldCount||0) + consSold;
    if (!gameState.flags.archieMotionEventSeen && gameState.flags.consSoldCount >= 1) {
      // Queue Archie motion event notification
      setTimeout(() => {
        pushNotification('Archie texted. Check Contacts.');
        gameState.flags._archieMotionPending = true;
        renderGame();
      }, 400);
    }
  }
  const playerCut = Math.floor(gross * 0.5); // 50/50 split with Archie
  const mugged = Math.random() < getEffectiveMugChance(0.20);
  if (mugged) {
    // Store pending sale, start combat; on win pay out
    gameState._pendingSaleCut = playerCut;
    startMugging();
  } else {
    gameState.player.cash += playerCut;
    closeModal();
    openModal('sale_result', { earned: playerCut, gross, mugged: false });
  }
}

  closeModal(); gameState.currentScreen='combat'; renderGame();

    hp:Math.round(template.hpBase*hpScale*guards), hpMax:Math.round(template.hpBase*hpScale*guards),

  gameState.combat = { active:true, context:'raid', veinId:vein.id, enemy, log:[`You move in on the vein at ${vein.location}. ${enemy.name} steps out to meet you.`], outcome:null, frozenTurns:0, motionTurns:0, motionPower:0, onWin:'raidWon' };
  closeModal(); gameState.currentScreen='combat'; renderGame();
}
function raidWon() {
  const vein = gameState.combat.enemy.veinRef;
  if (vein) { vein.npcClaimed=false; vein.claimed=true; vein.guards=0; vein.guardTemplate=null; gameState.player.veins.push(vein); }
}
function pushCombatSnapshot() {
  const c = gameState.combat, p = gameState.player;
  if (!c.enemy) return;
  c.snapshots = (c.snapshots || []).slice(-1); // keep max 2 (push makes it 2)
  c.snapshots.push({
    playerHp:   p.hp,
    enemyHp:    c.enemy.hp,
    log:        [...c.log],
    frozenTurns:c.frozenTurns,
    motionTurns:c.motionTurns,
    motionPower:c.motionPower,
    evadeTurns: c.evadeTurns||0,
    evadeChance:c.evadeChance||0,
  });
}
function combatRewind() {
  const c = gameState.combat, p = gameState.player;
  if (!c.active || !(c.snapshots||[]).length) return;
  // Check for rewind item (consumable or device)
  const hasConsumable = (p.inventory.rewind||0) > 0;
  const devId = p.equipment.device;
  const rewindDev = devId ? (p.devicesCompleted||[]).find(d => d.id === devId && DEVICE_TYPES[d.type]?.effect === 'rewind') : null;
  const hasDevice = rewindDev && getDeviceChargesLeft(rewindDev) > 0;
  if (!hasConsumable && !hasDevice) return;
  // Consume
  if (hasConsumable) { p.inventory.rewind--; }
  else { rewindDev.chargesUsedToday++; awardDeviceXP(rewindDev, 10); }
  // Restore the oldest available snapshot (up to 2 turns back)
  const snap = c.snapshots[0];
  c.snapshots = [];
  p.hp            = snap.playerHp;
  c.enemy.hp      = snap.enemyHp;
  c.log           = [...snap.log, '⟲ Time unspools. The moment resets. Only you remember.'];
  c.frozenTurns   = snap.frozenTurns;
  c.motionTurns   = snap.motionTurns;
  c.motionPower   = snap.motionPower;
  c.outcome       = null;
  c.evadeTurns    = 2;
  c.evadeChance   = 0.50;
  closeModal();
  renderGame();
}
function combatPlayerAttack() {
  const c = gameState.combat;
  if (!c.active || c.outcome) return;
  pushCombatSnapshot(); // snapshot state at start of player turn

  // Determine how many attacks this turn
  let attackCount = 1;
  if (c.motionTurns > 0) {
    attackCount = c.motionPower >= 3 ? 3 : 2;
    const motionLabel = attackCount === 3 ? 'three times' : 'twice';
    c.log.push(`Motion powder — you move ${motionLabel} as fast.`);
  }

  for (let i = 0; i < attackCount; i++) {
    if (c.enemy.hp <= 0) break;
    const atk = getAttackRange();
    const dmg = rand(atk.min, atk.max);
    c.enemy.hp = Math.max(0, c.enemy.hp - dmg);
    const frozenNote = c.frozenTurns > 0 ? ' (enemy frozen)' : '';
    const hitLabel = attackCount > 1 ? ` (hit ${i+1})` : '';
    c.log.push(`You attack${hitLabel} — ${dmg} damage${frozenNote}. Enemy: ${c.enemy.hp}/${c.enemy.hpMax} HP.`);
    if (c.enemy.hp <= 0) {
      c.outcome = 'win';
      c.log.push(c.context === 'mugging' ? `They leg it. Good call on their part.` : `They go down. Vein is yours.`);
      if (c.onWin) window[c.onWin]();
      renderGame(); return;
    }
  }

  // Tick motion powder
  if (c.motionTurns > 0) {
    c.motionTurns--;
    if (c.motionTurns === 0) c.log.push(`The powder wears off. Back to normal speed.`);
  }

  // Tick freeze and possibly enemy attacks
  if (c.frozenTurns > 0) {
    c.frozenTurns--;
    if (c.frozenTurns === 0) c.log.push(`The time effect wears off. They're coming back round.`);
  } else {
    enemyAttack();
  }
  renderGame();
}
function combatFlee() {
  const c = gameState.combat;
  if (!c.active||c.outcome) return;
  if (Math.random()>0.35) { c.outcome='fled'; c.log.push('You back off sharpish. Probably the right call.'); }
  else { c.log.push('You try to leg it — they get a parting shot in.'); enemyAttack(); }
  renderGame();
}
function combatUseTimePearl() {
  const c = gameState.combat;
  if (!c.active || c.outcome || gameState.player.inventory.timePearl <= 0) return;
  if (c.frozenTurns > 0) { c.log.push('Already frozen. Save the pearl.'); renderGame(); return; }
  gameState.player.inventory.timePearl--;
  const power = getCraftingEffectPower('timePearl');
  c.frozenTurns = power;
  c.log.push(`You throw a time pearl. The air goes thick. Everything slows. (${power} turn${power>1?'s':''})`);
  renderGame();
}
function combatUseMotionPowder() {
  const c = gameState.combat;
  if (!c.active || c.outcome || gameState.player.inventory.motionPowder <= 0) return;
  if (c.motionTurns > 0) { c.log.push('Already moving fast. Wait for it to wear off.'); renderGame(); return; }
  gameState.player.inventory.motionPowder--;
  const power = getCraftingEffectPower('motionPowder');
  // power 1-2 = attack twice for 1-2 turns; power 3 = attack 3x for 2 turns
  c.motionPower  = power;
  c.motionTurns  = power >= 3 ? 2 : 1;
  c.log.push(`You rub the powder in. The world slows slightly around you. You feel very fast.`);
  renderGame();
}
function combatUseItem() {
  const c = gameState.combat;
  if (!c.active || c.outcome) return;
  const p = gameState.player;
  const hasPearl   = (p.inventory.timePearl||0)   > 0;
  const hasMotion  = (p.inventory.motionPowder||0) > 0;
  const hasRewind  = (p.inventory.rewind||0)       > 0;
  const devId      = p.equipment.device;
  const dev        = devId ? (p.devicesCompleted||[]).find(d => d.id === devId) : null;
  const hasDevice  = dev && getDeviceChargesLeft(dev) > 0;
  const hasRewindDev = dev && DEVICE_TYPES[dev.type]?.effect === 'rewind' && hasDevice;
  const totalItems = [hasPearl,hasMotion,hasRewind,hasDevice].filter(Boolean).length;
  if (totalItems === 0) { c.log.push('You rummage in your pockets. Nothing useful. Classic.'); renderGame(); return; }
  if (totalItems === 1) {
    if (hasPearl)      { combatUseTimePearl();   return; }
    if (hasMotion)     { combatUseMotionPowder(); return; }
    if (hasRewind)     { openModal('combat_items',{}); return; } // open modal for confirm
    if (hasDevice)     { combatUseDevice();       return; }
  }
  openModal('combat_items', {});
}
function enemyAttack() {
  const c = gameState.combat;
  if (c.outcome||c.frozenTurns>0) return;
  // Evade check
  if ((c.evadeTurns||0) > 0) {
    c.evadeTurns--;
    if (Math.random() < (c.evadeChance||0)) {
      c.log.push(`${c.enemy.name} swings — you're not there. ${c.evadeTurns > 0 ? c.evadeTurns + ' evade turn' + (c.evadeTurns!==1?'s':'') + ' left.' : 'Evade fades.'}`);
      return;
    }
  }
  const dmg = rand(c.enemy.attackMin, c.enemy.attackMax);
  gameState.player.hp = Math.max(0, gameState.player.hp-dmg);
  c.log.push(`${c.enemy.name} hits you for ${dmg}. You: ${gameState.player.hp}/${gameState.player.hpMax} HP.`);
  if (gameState.player.hp<=0) { c.outcome='loss'; c.log.push('You\'re done. You come round somewhere unpleasant.'); gameState.player.hp=Math.round(gameState.player.hpMax*0.3); }
}
function exitCombat() {
  const c = gameState.combat;
  const outcome = c.outcome; const ctx = c.context;
  gameState.combat = { active:false, context:'raid', veinId:null, enemy:null, log:[], outcome:null, frozenTurns:0, motionTurns:0, motionPower:0, onWin:null, snapshots:[], evadeTurns:0, evadeChance:0 };
  if (ctx==='mugging' && outcome==='win') { /* sale_result modal already opened by muggingWon */ return; }
  if (ctx==='home_raid') { afterHomeRaidCombat(outcome); return; }
  gameState.currentScreen = outcome==='win'&&ctx==='raid' ? 'inventory' : 'home';
  renderGame();
}

// RENDER HELPERS

function makeEventScreen(eyebrow, time, cards, step, totalCards, onContinue, onComplete, completeLabel, rewindFnName) {
  const allShown  = step >= totalCards;
  const noneShown = step === 0;
  // Render ALL revealed cards — CSS handles overflow/push-up
  const cardsHTML = noneShown
    ? `<div class="event-card visible"><div class="event-card-text">…</div></div>`
    : cards.slice(0, step).map((card, i) => {
        const inner = card.type === 'speaker'
          ? `<div class="speaker-name">${card.speaker}</div><div class="event-card-text">${card.text}</div>`
          : `${card.label ? `<div class="event-card-label">${card.label}</div>` : ''}<div class="event-card-text">${card.text}</div>`;
        return `<div class="event-card ${card.type} visible">${inner}</div>`;
      }).join('');
  const dots = `<div class="progress-dots ec-dots">${Array.from({length:6}).map((_,i)=>`<div class="dot ${step>=Math.ceil((i+1)*totalCards/6)?'active':''}"></div>`).join('')}</div>`;
  const showItemBtn = rewindFnName && !noneShown && hasEventUsableItems();
  const itemBtn = showItemBtn ? `<button class="btn btn-secondary" style="flex-shrink:0;padding:10px 14px;font-size:16px" onclick="openEventItemModal('${rewindFnName}')" title="Use item">⟲</button>` : '';
  const mainBtn = noneShown
    ? `<button class="btn btn-primary" style="flex:1" onclick="${onContinue}()">Begin →</button>`
    : allShown
    ? `<button class="btn btn-primary" style="flex:1" onclick="${onComplete}()">${completeLabel||'Continue →'}</button>`
    : `<button class="btn btn-primary" style="flex:1" onclick="${onContinue}()">Continue →</button>`;
  const bar = `<div class="action-bar visible" style="display:flex;gap:8px">${itemBtn}${mainBtn}</div>`;
  return `<div class="event-screen"><div class="event-header"><div class="event-header-title">${eyebrow}</div><div class="event-header-time">${time}</div></div><div class="event-card-area">${cardsHTML}${dots}</div>${bar}</div>`;
}

// RENDER: INTRO
// ============================================================
function renderIntroScreen() {
  const allShown  = gameState.introStep >= INTRO_CARDS.length;
  const noneShown = gameState.introStep === 0;
  const cardsHTML = noneShown
    ? `<div class="event-card tension visible"><div class="event-card-label">Tuesday Night</div><div class="event-card-text">Rent is due Friday.</div></div>`
    : INTRO_CARDS.slice(0, gameState.introStep).map(card => {
        const inner = card.type === 'speaker'
          ? `<div class="speaker-name">${card.speaker}</div><div class="event-card-text">${card.text}</div>`
          : `${card.label ? `<div class="event-card-label">${card.label}</div>` : ''}<div class="event-card-text">${card.text}</div>`;
        return `<div class="event-card ${card.type} visible">${inner}</div>`;
      }).join('');
  const dots = `<div class="progress-dots ec-dots">${Array.from({length:6}).map((_,i)=>`<div class="dot ${gameState.introStep>=Math.ceil((i+1)*INTRO_CARDS.length/6)?'active':''}"></div>`).join('')}</div>`;
  const bar = noneShown
    ? `<div class="action-bar visible"><button class="btn btn-primary" onclick="advanceIntro()">Begin →</button></div>`
    : allShown
    ? `<div class="action-bar visible"><button class="btn btn-primary" onclick="completeIntro()">Accept Archie's offer →</button><button class="btn btn-secondary" onclick="completeIntro()">You could really use the money... →</button></div>`
    : `<div class="action-bar visible"><button class="btn btn-primary" onclick="advanceIntro()">Continue →</button></div>`;
  return `<div class="event-screen"><div class="event-header"><div class="event-header-title">London — Day 1</div><div class="event-header-time">22:47</div></div><div class="event-card-area">${cardsHTML}${dots}</div>${bar}</div>`;
}

// RENDER: VEINS

function renderVeinsScreen() {
  const veins = gameState.player.veins;
  const p     = gameState.player;

  const veinCards = veins.length === 0
    ? `<div class="card" style="font-family:var(--font-ui);font-size:14px;color:var(--muted);text-align:center;padding:30px 20px">
        No veins yet.<br>Seed one below to get started.
       </div>`
    : veins.map(v => {
        const ore     = ORE_TYPES[v.oreType];
        const ld      = VEIN_LEVELS[v.level];
        const sec     = SECURITY_TIERS.find(s => s.id === v.security);
        const chargePct = Math.round(((v.chargeBlocks||0) / ld.rechargeBlocks) * 100);
        const devPct    = v.level >= 5 ? 100 : Math.min(100, Math.round(((v.devBar||0) / ld.devBarMax) * 100));
        const devAlmost = devPct >= 75 && v.level < 5;
        return `
          <div class="vein-list-card" onclick="openModal('vein_detail',{veinId:'${v.id}'})">
            <div class="vein-list-card-top">
              <div class="vein-list-name">${ore.symbol} ${ore.name.replace(' Orichalchum','')}</div>
              <div class="vein-list-level">Lv${v.level} · ${v.levelLabel}</div>
            </div>
            <div class="vein-list-meta">
              <span>${v.charged ? '✅ Ready to harvest' : `⏳ Charging`}</span>
              <span>🔒 ${sec.label}</span>
            </div>
            <div style="margin-top:7px;display:flex;flex-direction:column;gap:6px">
              <div>
                <div style="display:flex;justify-content:space-between;font-family:var(--font-ui);font-size:9px;text-transform:uppercase;letter-spacing:0.1em;color:var(--muted);margin-bottom:3px">
                  <span>Charge</span>
                  <span>${v.charged ? 'Full' : `${v.chargeBlocks||0}/${ld.rechargeBlocks} blocks`}</span>
                </div>
                <div class="dev-bar-wrap">
                  <div class="dev-bar-fill" style="width:${v.charged ? 100 : chargePct}%;background:${v.charged ? 'var(--success)' : 'var(--amber)'}"></div>
                </div>
              </div>
              <div>
                <div style="display:flex;justify-content:space-between;font-family:var(--font-ui);font-size:9px;text-transform:uppercase;letter-spacing:0.1em;color:var(--muted);margin-bottom:3px">
                  <span>Development</span>
                  <span>${v.level >= 5 ? 'Max level' : `${v.devBar||0}/${ld.devBarMax}`}</span>
                </div>
                <div class="dev-bar-wrap">
                  <div class="dev-bar-fill ${devAlmost?'almost':''}" style="width:${devPct}%"></div>
                </div>
              </div>
            </div>
          </div>`;
      }).join('');



  const cultivatingSkillInfo = `Lv${p.cultivatingSkill} · ${Math.round(getCultivatingSuccessChance()*100)}% success · +${getCultivatingBarGain()} dev/cultivate`;

  return `
    <div class="veins-screen screen-fade-enter">
      <div class="screen-header">
        <button class="screen-header-back" onclick="navigate('home')">‹</button>
        <div class="screen-header-titles">
          <div class="screen-header-eyebrow">Operations</div>
          <div class="screen-header-title">Veins</div>
          <div class="screen-header-sub">${veins.length} active · ${cultivatingSkillInfo}</div>
        </div>
      </div>
      <div class="veins-body">
        ${veinCards}
        <div style="margin-top:8px">

            <div class="action-card-left">
              <div class="action-card-title">🌱 Seed a new vein</div>
              <div class="action-card-sub">Costs ${SEED_ORE_COST} calc · uses 1 time block · ${Math.round(getCultivatingSuccessChance()*100)}% success at Lv${p.cultivatingSkill}</div>
            </div>
            <div class="action-card-arrow">›</div>
          </div>
        </div>

}

function renderInventoryScreen() {
  const p = gameState.player;
  const tab = gameState.inventoryTab || 'ore';

  // ORE TAB
  const oreTypes = ORE_TYPE_KEYS.filter(k => (p.orichalchum[k]||0) > 0);
  const oreHTML = oreTypes.length === 0
    ? '<div class="inv-empty">No orichalchum in stock.<br>Get searching.</div>'
    : oreTypes.map(k => {
        const ore = ORE_TYPES[k];
        return `<div class="ore-row">
          <div class="ore-row-symbol">${ore.symbol}</div>
          <div class="ore-row-info">
            <div class="ore-row-name">${ore.name}</div>
            <div class="ore-row-sub">${ore.flavorText}</div>
          </div>
          <div class="ore-row-qty">${p.orichalchum[k]}</div>
        </div>`;
      }).join('');

  // CONSUMABLES TAB
  const pearlCount  = p.inventory.timePearl;
  const motionCount = p.inventory.motionPowder;
  const pearlCard  = pearlCount > 0 ? `<div class="item-card">
    <div class="item-card-top"><div class="item-card-icon">⧖</div><div class="item-card-name">Time Pearl ×${pearlCount}</div></div>

  </div>` : '';
  const motionCard = motionCount > 0 ? `<div class="item-card">

  const equippedDeviceId = p.equipment.device;

  const devicesCompleted = p.devicesCompleted || [];

      }).join('');

  const equippedDevice = equippedDeviceId ? devicesCompleted.find(d => d.id === equippedDeviceId) : null;

  const deviceSlotHTML = equippedDevice
    ? (() => {
        const dt = DEVICE_TYPES[equippedDevice.type];
        const charges = getDeviceChargesLeft(equippedDevice);
        const xpNext  = DEVICE_XP_LEVELS[equippedDevice.level+1]||null;
        return `<div class="item-card equipped" style="margin-bottom:8px">
          <div class="item-card-top">
            <div class="item-card-icon">${dt.symbol}</div>
            <div>
              <div class="item-card-name">${dt.name} <span class="pill pill-amber">Equipped</span></div>

        return `<div class="item-card" style="margin-bottom:8px">
          <div class="item-card-top">

const SAVE_KEY_PREFIX = 'vein_save_';

function getSaveSlots() {
  const slots = [];
  for (let i = 1; i <= 3; i++) {
    const raw = localStorage.getItem(SAVE_KEY_PREFIX + i);
    if (raw) {
      try {
        const meta = JSON.parse(raw).__meta;
        slots.push({ slot: i, meta, raw });
      } catch(e) { slots.push({ slot: i, meta: null, raw: null }); }
    } else {
      slots.push({ slot: i, meta: null, raw: null });
    }
  }
  return slots;
}

function saveToSlot(slot) {
  const snapshot = JSON.parse(JSON.stringify(gameState));
  snapshot.__meta = {
    savedAt: new Date().toLocaleString('en-GB'),
    day: gameState.world.day,
    cash: gameState.player.cash,
    stage: gameState.flags.tutorialStage,
  };
  localStorage.setItem(SAVE_KEY_PREFIX + slot, JSON.stringify(snapshot));
  pushNotification('Game saved to slot ' + slot + '.');
  renderGame();
}

function loadFromSlot(slot) {
  const raw = localStorage.getItem(SAVE_KEY_PREFIX + slot);
  if (!raw) return;
  try {
    const loaded = JSON.parse(raw);
    delete loaded.__meta;
    Object.assign(gameState, loaded);
    renderGame();
  } catch(e) {
    pushNotification('Save slot ' + slot + ' appears corrupted. Sorry about that.');
    renderGame();
  }
}

function deleteSlot(slot) {
  localStorage.removeItem(SAVE_KEY_PREFIX + slot);
  renderGame();
}

function exportSave() {
  const snapshot = JSON.parse(JSON.stringify(gameState));
  snapshot.__meta = {
    savedAt: new Date().toLocaleString('en-GB'),
    day: gameState.world.day,
    cash: gameState.player.cash,
  };
  const encoded = btoa(JSON.stringify(snapshot));
  gameState.modal = { type: 'export_save', data: { encoded } };
  renderGame();
}

function importSave() {
  gameState.modal = { type: 'import_save', data: {} };
  renderGame();
}

function doImport(encoded) {
  try {
    const loaded = JSON.parse(atob(encoded.trim()));
    delete loaded.__meta;
    Object.assign(gameState, loaded);
    closeModal();
    renderGame();
  } catch(e) {
    pushNotification('Could not read that save string. Make sure you copied the whole thing.');
    closeModal();
    renderGame();
  }
}

function confirmNewGame() {
  gameState.modal = { type: 'confirm_new_game', data: {} };
  renderGame();
}
