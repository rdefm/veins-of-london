<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vein — Quest Prose Editor</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #1b1b1f;
    --panel: #232329;
    --panel-alt: #26262e;
    --border: #35353f;
    --text: #e6e6ea;
    --text-dim: #9a9aa5;
    --accent: #7aa2f7;
    --accent-dim: #3d4a6b;
    --dirty: #e0af68;
    --danger: #f7768e;
    --ok: #9ece6a;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, Segoe UI, Helvetica, Arial, sans-serif;
    font-size: 14px;
  }
  #app { display: flex; height: 100vh; }

  #sidebar {
    width: 320px; min-width: 240px; max-width: 480px;
    background: var(--panel); border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
  }
  #sidebar-header {
    padding: 12px; border-bottom: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 8px;
  }
  #sidebar-header h1 { font-size: 15px; margin: 0 0 2px; }
  #sidebar-header .sub { font-size: 12px; color: var(--text-dim); }
  #open-btn, #save-btn, #new-quest-btn, .cancel-btn, .add-card-btn, .add-choice-btn {
    background: var(--accent-dim); color: var(--text);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 10px; cursor: pointer; font-size: 13px;
  }
  #open-btn:hover, #save-btn:hover:not(:disabled), #new-quest-btn:hover:not(:disabled),
  .cancel-btn:hover, .add-card-btn:hover, .add-choice-btn:hover { background: var(--accent); color: #14141a; }
  #save-btn:disabled, #new-quest-btn:disabled { opacity: 0.4; cursor: default; }
  .add-card-btn { display: block; width: 100%; margin-top: 4px; }
  .add-choice-btn { margin-top: 4px; font-size: 12px; padding: 4px 8px; }
  #search {
    width: 100%; padding: 6px 8px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
    font-size: 13px;
  }
  #file-list { flex: 1; overflow-y: auto; }
  .file-row {
    padding: 8px 12px; cursor: pointer; border-bottom: 1px solid #0002;
    font-size: 13px; display: flex; justify-content: space-between; gap: 6px;
  }
  .file-row:hover { background: var(--panel-alt); }
  .file-row.active { background: var(--accent-dim); }
  .file-row .fname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-row .dirty-dot { color: var(--dirty); flex-shrink: 0; }
  #file-count { padding: 6px 12px; font-size: 11px; color: var(--text-dim); }

  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #main-header {
    padding: 12px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    background: var(--panel);
  }
  #quest-title { font-size: 16px; font-weight: 600; }
  #quest-title .id { color: var(--text-dim); font-weight: 400; font-family: monospace; margin-left: 8px; }
  #status { font-size: 12px; color: var(--text-dim); }
  #status.dirty { color: var(--dirty); }
  #status.ok { color: var(--ok); }
  #status.error { color: var(--danger); }

  #content { flex: 1; overflow-y: auto; padding: 20px; }
  #empty-state { color: var(--text-dim); padding: 40px; text-align: center; }

  .card-block {
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 14px 16px; margin-bottom: 14px;
  }
  .card-block-header {
    display: flex; align-items: center; gap: 8px; margin-bottom: 10px;
  }
  .type-badge {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em;
    padding: 2px 8px; border-radius: 10px; background: var(--accent-dim); color: var(--accent);
  }
  .card-index { color: var(--text-dim); font-size: 12px; }
  .type-select {
    background: var(--accent-dim); color: var(--text); border: 1px solid var(--border);
    border-radius: 10px; padding: 2px 8px; font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.04em; cursor: pointer;
  }
  .small-btn {
    background: var(--panel-alt); color: var(--text-dim); border: 1px solid var(--border);
    border-radius: 4px; width: 24px; height: 22px; cursor: pointer; font-size: 11px; line-height: 1;
  }
  .small-btn:hover:not(:disabled) { background: var(--accent-dim); color: var(--text); }
  .small-btn:disabled { opacity: 0.3; cursor: default; }
  .small-btn-danger:hover:not(:disabled) { background: var(--danger); color: #14141a; border-color: var(--danger); }
  .choice-block-header { display: flex; align-items: center; justify-content: space-between; }

  .field-row { margin-bottom: 8px; }
  .field-row label {
    display: block; font-size: 11px; color: var(--text-dim); margin-bottom: 3px;
    text-transform: uppercase; letter-spacing: 0.03em;
  }
  .field-row input[type=text], .field-row textarea {
    width: 100%; padding: 6px 8px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
    font-family: inherit; font-size: 13px; resize: vertical;
  }
  .field-row textarea { min-height: 54px; line-height: 1.4; }
  .field-row input.edited, .field-row textarea.edited { border-color: var(--dirty); }

  .choices-wrap { margin-top: 12px; padding-left: 14px; border-left: 2px solid var(--border); }
  .choice-block {
    background: var(--panel-alt); border: 1px solid var(--border); border-radius: 6px;
    padding: 10px 12px; margin-bottom: 10px;
  }
  .choice-block-header { font-size: 12px; color: var(--text-dim); margin-bottom: 6px; }

  .readonly-json {
    background: var(--bg); border: 1px dashed var(--border); border-radius: 6px;
    padding: 8px 10px; font-family: ui-monospace, Consolas, monospace; font-size: 12px;
    white-space: pre-wrap; word-break: break-word; color: var(--text-dim);
    max-height: 200px; overflow-y: auto;
  }

  .field-row select, .field-row input[type=number] {
    width: 100%; padding: 5px 8px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
    font-family: inherit; font-size: 13px;
  }
  .mech { margin-top: 6px; }
  .mech-row { display: flex; flex-wrap: wrap; gap: 0 10px; align-items: flex-end; }
  .mech-cell { flex: 0 1 150px; min-width: 110px; }
  .mech-wide { flex: 1 1 240px; }
  .mech-sub {
    border: 1px dashed var(--border); border-radius: 6px;
    padding: 8px 10px 4px; margin-bottom: 8px;
  }
  .mech-heading {
    font-size: 11px; color: var(--accent); text-transform: uppercase;
    letter-spacing: 0.04em; margin-bottom: 6px;
  }
  .mech-mod { border-top: 1px solid var(--border); padding-top: 6px; }
  .mech-json {
    background: var(--bg); border: 1px dashed var(--border); border-radius: 6px;
    padding: 6px 8px; font-family: ui-monospace, Consolas, monospace; font-size: 12px;
    white-space: pre-wrap; word-break: break-word; color: var(--text-dim);
    max-height: 160px; overflow-y: auto;
  }
  .mech-check {
    display: flex; align-items: center; gap: 6px; font-size: 12px;
    color: var(--text-dim); margin-bottom: 14px;
  }
  .mech-btn {
    background: var(--panel-alt); color: var(--text-dim); border: 1px solid var(--border);
    border-radius: 6px; padding: 4px 8px; cursor: pointer; font-size: 12px; margin-bottom: 8px;
  }
  .mech-btn:hover { background: var(--accent-dim); color: var(--text); }
  .mech-btn-danger:hover { background: var(--danger); color: #14141a; border-color: var(--danger); }

  .notes-panel textarea { min-height: 140px; font-family: ui-monospace, Consolas, monospace; }
  .notes-panel .meta-label-sub { font-size: 11px; color: var(--text-dim); margin: -6px 0 10px; }

  .meta-panel {
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 14px 16px; margin-top: 20px;
  }
  .meta-panel h2 { font-size: 13px; margin: 0 0 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.04em; }
  .meta-field { margin-bottom: 12px; }
  .meta-field:last-child { margin-bottom: 0; }
  .meta-field .meta-label { font-size: 11px; color: var(--text-dim); margin-bottom: 4px; }

  #unsupported {
    padding: 40px; max-width: 560px; margin: 60px auto; text-align: center;
    color: var(--text-dim); line-height: 1.6;
  }
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div id="sidebar-header">
      <h1>Quest Prose Editor</h1>
      <div class="sub">data/events/</div>
      <button id="open-btn">Open data/events folder&hellip;</button>
      <button id="new-quest-btn" disabled>+ New quest</button>
      <input id="search" type="text" placeholder="Filter by id or filename&hellip;" disabled>
    </div>
    <div id="file-count"></div>
    <div id="file-list"></div>
  </div>
  <div id="main">
    <div id="main-header">
      <div id="quest-title">No quest selected</div>
      <div style="display:flex; align-items:center; gap:12px;">
        <div id="status"></div>
        <button id="save-btn" disabled>Save</button>
      </div>
    </div>
    <div id="content">
      <div id="empty-state">Open the data/events folder, then pick a quest from the sidebar.</div>
    </div>
  </div>
</div>

<script>
"use strict";

/* ---------- Choice mechanics (shared) ---------- */

// Byte-identical in tools/quest-editor.html and tools/quest-editor-mobile.html
// (tools/test_quest_editor.js enforces it): the option and event mechanics
// both editors author, per docs/REFERENCE.md §3.9a (option id, check,
// success/fail, requires, goto) and §3.9b (event `at`). Effects stay
// read-only and pass through untouched.

const AT_BLOCKS = ["morning", "afternoon", "evening", "night"];
const SHOW_MODES = ["odds", "hint", "hidden"];
const OPTION_KEY_ORDER = ["label", "id", "requires", "effects", "result_text", "goto", "check", "success", "fail", "bySuccesses"];
const CONDITION_KINDS = [
  { kind: "flag", label: "Flag set", modOnly: false },
  { kind: "choice", label: "Earlier choice", modOnly: false },
  { kind: "path", label: "State path", modOnly: false },
  { kind: "relation", label: "Contact relation", modOnly: false },
  { kind: "cash", label: "Cash", modOnly: false },
  { kind: "item", label: "Item held", modOnly: false },
  { kind: "itemEquipped", label: "Item equipped", modOnly: false },
  { kind: "itemOptional", label: "Item (optional toggle)", modOnly: true },
];

// Empty prose fields are written as null, matching the convention every
// hand-authored event file already uses (e.g. a narration card's unused
// "speaker" key) rather than empty strings.
function normProse(v) {
  const t = (v || "").trim();
  return t === "" ? null : t;
}

function deepEqual(a, b) {
  return JSON.stringify(a) === JSON.stringify(b);
}

function deepClone(v) {
  return v === undefined ? undefined : JSON.parse(JSON.stringify(v));
}

function replaceContents(target, source) {
  for (const k of Object.keys(target)) delete target[k];
  Object.assign(target, source);
}

function orderOptionKeys(opt) {
  const out = {};
  for (const k of OPTION_KEY_ORDER) if (k in opt) out[k] = opt[k];
  for (const k of Object.keys(opt)) if (!(k in out)) out[k] = opt[k];
  return out;
}

function isCheckOption(opt) {
  return !!opt && !!opt.check && typeof opt.check === "object";
}

// Which REFERENCE §3.9a condition a mod / requires object states.
function conditionKind(c) {
  if (!c || typeof c !== "object") return "";
  if ("flag" in c) return "flag";
  if ("choice" in c) return "choice";
  if ("path" in c) return "path";
  if ("relation" in c) return "relation";
  if ("cash" in c) return "cash";
  if ("item" in c) return c.optional ? "itemOptional" : c.equipped ? "itemEquipped" : "item";
  return "";
}

function conditionTemplate(kind, isMod) {
  switch (kind) {
    case "flag": return { flag: "" };
    case "choice": return { choice: { event: "", card: 0, option: "" } };
    case "path": return isMod ? { path: "", perPoint: 0 } : { path: "", atLeast: 0 };
    case "relation": return { relation: "", atLeast: 0 };
    case "cash": return { cash: { atLeast: 0 } };
    case "item": return { item: "" };
    case "itemEquipped": return { item: "", equipped: true };
    case "itemOptional": return { item: "", optional: true };
    default: return {};
  }
}

// Rewrites obj in place to a fresh condition of `kind`, keeping a mod's
// add/label or a requires' display/reason.
function setConditionKind(obj, kind, isMod) {
  const fresh = conditionTemplate(kind, isMod);
  if (isMod) {
    if (kind !== "path") fresh.add = typeof obj.add === "number" ? obj.add : 0;
    fresh.label = typeof obj.label === "string" ? obj.label : "";
  } else {
    for (const k of ["display", "reason"]) if (k in obj) fresh[k] = obj[k];
  }
  replaceContents(obj, fresh);
}

function optionToCheck(opt) {
  const success = { result_text: opt.result_text === undefined ? null : opt.result_text, effects: [] };
  if (opt.goto !== undefined) success.goto = opt.goto;
  const next = Object.assign({}, opt, {
    check: { base: 0.5, mods: [] },
    success,
    fail: { result_text: null, effects: [] },
  });
  delete next.result_text;
  delete next.goto;
  replaceContents(opt, orderOptionKeys(next));
}

function optionToPlain(opt) {
  const success = opt.success && typeof opt.success === "object" ? opt.success : {};
  const next = Object.assign({}, opt, {
    effects: Array.isArray(opt.effects) ? opt.effects : [],
    result_text: success.result_text === undefined ? null : success.result_text,
  });
  if (success.goto !== undefined) next.goto = success.goto;
  for (const k of ["check", "success", "fail", "bySuccesses"]) delete next[k];
  replaceContents(opt, orderOptionKeys(next));
}

// Normalizes one editor option into the saved schema: prose trimmed (blank
// → null), a plain option always carries effects + result_text, a check
// option's success/fail always carry result_text + effects
// (GameData._validate_choice_card).
function buildOptionForSave(opt) {
  const o = deepClone(opt);
  o.label = normProse(o.label);
  if (isCheckOption(o)) {
    for (const key of ["success", "fail"]) {
      const out = o[key] && typeof o[key] === "object" ? o[key] : {};
      o[key] = Object.assign({ result_text: null, effects: [] }, out, { result_text: normProse(out.result_text) });
    }
  } else {
    if (!Array.isArray(o.effects)) o.effects = [];
    o.result_text = normProse(o.result_text);
  }
  return orderOptionKeys(o);
}

function mechEl(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}

function mechCell(labelText, control, wide) {
  const row = mechEl("div", "field-row mech-cell" + (wide ? " mech-wide" : ""));
  row.appendChild(mechEl("label", "", labelText));
  row.appendChild(control);
  return row;
}

// Text control bound to obj[key]. A blank value deletes the key when
// blank === "delete", stores null when blank === "null", else stores "".
function mechText(obj, key, changed, blank, multiline, placeholder) {
  const c = document.createElement(multiline ? "textarea" : "input");
  if (!multiline) c.type = "text";
  c.value = obj[key] === null || obj[key] === undefined ? "" : String(obj[key]);
  if (placeholder) c.placeholder = placeholder;
  c.addEventListener("input", () => {
    if (c.value === "" && blank === "delete") delete obj[key];
    else if (c.value === "" && blank === "null") obj[key] = null;
    else obj[key] = c.value;
    changed();
  });
  return c;
}

// Number control bound to obj[key]; blank deletes an optional key, else 0.
function mechNumber(obj, key, changed, optional, placeholder) {
  const c = document.createElement("input");
  c.type = "number";
  c.step = "any";
  c.value = typeof obj[key] === "number" ? String(obj[key]) : "";
  if (placeholder) c.placeholder = placeholder;
  c.addEventListener("input", () => {
    const n = c.value.trim() === "" ? NaN : Number(c.value);
    if (Number.isFinite(n)) obj[key] = n;
    else if (optional) delete obj[key];
    else obj[key] = 0;
    changed();
  });
  return c;
}

function mechSelect(choices, current, onPick) {
  const s = document.createElement("select");
  for (const [value, label] of choices) {
    const o = document.createElement("option");
    o.value = value;
    o.textContent = label;
    if (value === current) o.selected = true;
    s.appendChild(o);
  }
  s.addEventListener("change", () => onPick(s.value));
  return s;
}

function mechCheckbox(labelText, checked, onToggle) {
  const wrap = mechEl("label", "mech-check");
  const box = document.createElement("input");
  box.type = "checkbox";
  box.checked = checked;
  box.addEventListener("change", () => onToggle(box.checked));
  wrap.appendChild(box);
  wrap.appendChild(mechEl("span", "", labelText));
  return wrap;
}

function mechButton(text, danger, onClick) {
  const b = mechEl("button", "mech-btn" + (danger ? " mech-btn-danger" : ""), text);
  b.type = "button";
  b.addEventListener("click", onClick);
  return b;
}

function mechReadonly(labelText, value) {
  return mechCell(labelText, mechEl("div", "mech-json", JSON.stringify(value, null, 2)), true);
}

// Re-renders itself on structural changes (kind/mode switches, add/remove)
// so typing into a plain field never rebuilds the form under the cursor.
function renderOptionMechanics(opt, changed) {
  const box = mechEl("div", "mech");
  const redraw = () => box.replaceChildren(...optionMechanicsRows(opt, changed, () => { changed(); redraw(); }));
  redraw();
  return box;
}

function renderEventAt(ev, changed) {
  const box = mechEl("div", "mech");
  const redraw = () => box.replaceChildren(...eventAtRows(ev, changed, () => { changed(); redraw(); }));
  redraw();
  return box;
}

function eventAtRows(ev, changed, restructure) {
  const row = mechEl("div", "mech-row");
  const at = ev.at && typeof ev.at === "object" ? ev.at : null;
  const blocks = [["", "Whenever triggered"]].concat(AT_BLOCKS.map((b) => [b, b]));
  row.appendChild(mechCell("Runs at block", mechSelect(blocks, at ? at.block : "", (v) => {
    if (!v) delete ev.at;
    else if (at) at.block = v;
    else ev.at = { block: v, advance: false };
    restructure();
  })));
  if (at) row.appendChild(mechCheckbox("Advance the clock to this block", !!at.advance, (on) => { at.advance = on; changed(); }));
  return [row];
}

function optionMechanicsRows(opt, changed, restructure) {
  const rows = [];
  const check = isCheckOption(opt);
  const head = mechEl("div", "mech-row");
  head.appendChild(mechCell("Option id", mechText(opt, "id", changed, "delete", false, "optional")));
  head.appendChild(mechCell("Resolves by", mechSelect([["plain", "Fixed result"], ["check", "Check (roll)"]], check ? "check" : "plain", (v) => {
    if (v === "check") optionToCheck(opt);
    else if (confirm("Switch to a fixed result? The check, its modifiers and the fail outcome are dropped; the success text becomes the result.")) optionToPlain(opt);
    restructure();
  })));
  rows.push(head);
  rows.push(requiresBlock(opt, changed, restructure));
  if (Array.isArray(opt.effects) && (!check || opt.effects.length)) {
    rows.push(mechReadonly(check ? "Effects before the roll (read-only)" : "Effects (read-only)", opt.effects));
  }
  if (check) {
    rows.push(...checkRows(opt, changed, restructure));
  } else {
    rows.push(mechCell("Result text", mechText(opt, "result_text", changed, "null", true), true));
    rows.push(gotoRow(opt, changed));
  }
  return rows;
}

function gotoRow(obj, changed) {
  const row = mechEl("div", "mech-row");
  row.appendChild(mechCell("Go to card idx", mechNumber(obj, "goto", changed, true, "next card")));
  return row;
}

function requiresBlock(opt, changed, restructure) {
  const box = mechEl("div", "mech-sub");
  const req = opt.requires && typeof opt.requires === "object" ? opt.requires : null;
  const kinds = [["", "Always available"]].concat(CONDITION_KINDS.filter((k) => !k.modOnly).map((k) => [k.kind, k.label]));
  const row = mechEl("div", "mech-row");
  row.appendChild(mechCell("Requires", mechSelect(kinds, conditionKind(req), (v) => {
    if (!v) delete opt.requires;
    else {
      if (!req) opt.requires = {};
      setConditionKind(opt.requires, v, false);
    }
    restructure();
  })));
  box.appendChild(row);
  if (!req) return box;
  conditionCells(req, false, changed).forEach((c) => row.appendChild(c));
  const row2 = mechEl("div", "mech-row");
  row2.appendChild(mechCell("When unmet", mechSelect([["hide", "Hide"], ["disable", "Show disabled"]], req.display === "disable" ? "disable" : "hide", (v) => {
    if (v === "disable") req.display = "disable";
    else delete req.display;
    restructure();
  })));
  row2.appendChild(mechCell("Reason (shown when disabled)", mechText(req, "reason", changed, "delete"), true));
  box.appendChild(row2);
  return box;
}

function conditionCells(c, isMod, changed) {
  const kind = conditionKind(c);
  const cells = [];
  if (kind === "flag") cells.push(mechCell("Flag", mechText(c, "flag", changed, "")));
  if (kind === "choice" && c.choice && typeof c.choice === "object") {
    const ch = c.choice;
    cells.push(mechCell("Event id", mechText(ch, "event", changed, "")));
    cells.push(mechCell("Card idx", mechNumber(ch, "card", changed, false)));
    const opt = mechText(ch, "option", changed, "", false, "option id or index");
    // A bare number is an option index; anything else is an option id.
    opt.addEventListener("input", () => {
      if (/^\d+$/.test(opt.value)) ch.option = Number(opt.value);
      changed();
    });
    cells.push(mechCell("Option", opt));
  }
  if (kind === "path") {
    cells.push(mechCell("State path", mechText(c, "path", changed, "", false, "e.g. player.cash")));
    if (isMod) {
      cells.push(mechCell("Per point", mechNumber(c, "perPoint", changed, false)));
      cells.push(mechCell("Above", mechNumber(c, "above", changed, true, "0")));
    } else {
      cells.push(mechCell("At least", mechNumber(c, "atLeast", changed, false)));
    }
  }
  if (kind === "relation") {
    cells.push(mechCell("Contact id", mechText(c, "relation", changed, "")));
    cells.push(mechCell("At least", mechNumber(c, "atLeast", changed, false)));
  }
  if (kind === "cash" && c.cash && typeof c.cash === "object") {
    cells.push(mechCell("Cash at least £", mechNumber(c.cash, "atLeast", changed, false)));
  }
  if (kind === "item" || kind === "itemEquipped" || kind === "itemOptional") {
    cells.push(mechCell("Item id", mechText(c, "item", changed, "")));
  }
  if (kind === "itemOptional") {
    cells.push(mechCheckbox("Consumed on commit", !!c.consume, (on) => {
      if (on) c.consume = true;
      else delete c.consume;
      changed();
    }));
  }
  return cells;
}

function modBlock(mod, i, mods, changed, restructure) {
  const row = mechEl("div", "mech-row mech-mod");
  row.appendChild(mechCell("Modifier " + (i + 1), mechSelect(CONDITION_KINDS.map((k) => [k.kind, k.label]), conditionKind(mod), (v) => {
    setConditionKind(mod, v, true);
    restructure();
  })));
  conditionCells(mod, true, changed).forEach((c) => row.appendChild(c));
  if (conditionKind(mod) !== "path") row.appendChild(mechCell("Add", mechNumber(mod, "add", changed, false, "e.g. 0.1")));
  row.appendChild(mechCell("Label", mechText(mod, "label", changed, ""), true));
  row.appendChild(mechButton("✕ Remove", true, () => {
    mods.splice(i, 1);
    restructure();
  }));
  return row;
}

function outcomeBlock(opt, key, title, changed, restructure) {
  const box = mechEl("div", "mech-sub");
  box.appendChild(mechEl("div", "mech-heading", title));
  const out = opt[key] && typeof opt[key] === "object" ? opt[key] : null;
  if (!out) {
    box.appendChild(mechButton("+ Add " + key + " outcome", false, () => {
      opt[key] = { result_text: null, effects: [] };
      restructure();
    }));
    return box;
  }
  box.appendChild(mechCell("Result text", mechText(out, "result_text", changed, "null", true), true));
  if (Array.isArray(out.effects)) box.appendChild(mechReadonly("Effects (read-only)", out.effects));
  box.appendChild(gotoRow(out, changed));
  return box;
}

function checkRows(opt, changed, restructure) {
  const check = opt.check;
  const rows = [];
  const odds = mechEl("div", "mech-sub");
  odds.appendChild(mechEl("div", "mech-heading", "Check"));
  const row = mechEl("div", "mech-row");
  row.appendChild(mechCell("Base chance", mechNumber(check, "base", changed, false)));
  row.appendChild(mechCell("Min", mechNumber(check, "min", changed, true, "default")));
  row.appendChild(mechCell("Max", mechNumber(check, "max", changed, true, "default")));
  row.appendChild(mechCell("Show", mechSelect(SHOW_MODES.map((m) => [m, m === "odds" ? "odds (default)" : m]), check.show || "odds", (v) => {
    if (v === "odds") delete check.show;
    else check.show = v;
    changed();
  })));
  row.appendChild(mechCell("Attempts", mechNumber(check, "attempts", changed, true, "1")));
  odds.appendChild(row);

  const mods = Array.isArray(check.mods) ? check.mods : [];
  mods.forEach((mod, i) => odds.appendChild(modBlock(mod, i, mods, changed, restructure)));
  odds.appendChild(mechButton("+ Add modifier", false, () => {
    if (!Array.isArray(check.mods)) check.mods = [];
    const m = {};
    setConditionKind(m, "flag", true);
    check.mods.push(m);
    restructure();
  }));
  if (check.perSuccess !== undefined) odds.appendChild(mechReadonly("Per success effects (read-only)", check.perSuccess));
  rows.push(odds);

  rows.push(outcomeBlock(opt, "success", "On success", changed, restructure));
  rows.push(outcomeBlock(opt, "fail", "On failure", changed, restructure));
  if (opt.bySuccesses !== undefined) rows.push(mechReadonly("By success count (read-only)", opt.bySuccesses));
  return rows;
}

/* ---------- End choice mechanics ---------- */

/* ---------- Minimal JSON parser with source-offset tracking ---------- */

function parseJSONWithPositions(text) {
  let i = 0;
  const len = text.length;

  function isWs(c) { return c === " " || c === "\t" || c === "\n" || c === "\r"; }
  function skipWs() { while (i < len && isWs(text[i])) i++; }
  function fail(msg) { throw new Error("JSON parse error at offset " + i + ": " + msg); }

  function parseValue() {
    skipWs();
    const c = text[i];
    if (c === "{") return parseObject();
    if (c === "[") return parseArray();
    if (c === "\"") return parseString();
    if (c === "t" || c === "f") return parseBoolLiteral();
    if (c === "n") return parseNullLiteral();
    if (c === "-" || (c >= "0" && c <= "9")) return parseNumber();
    fail("unexpected character " + JSON.stringify(c));
  }

  function parseObject() {
    const start = i;
    i++; // {
    const entries = [];
    skipWs();
    if (text[i] === "}") { i++; return { kind: "object", start, end: i, entries }; }
    for (;;) {
      skipWs();
      if (text[i] !== "\"") fail("expected object key");
      const keyNode = parseString();
      skipWs();
      if (text[i] !== ":") fail("expected ':'");
      i++;
      const valueNode = parseValue();
      entries.push({ key: keyNode.value, keyNode, valueNode });
      skipWs();
      if (text[i] === ",") { i++; continue; }
      if (text[i] === "}") { i++; break; }
      fail("expected ',' or '}'");
    }
    return { kind: "object", start, end: i, entries };
  }

  function parseArray() {
    const start = i;
    i++; // [
    const items = [];
    skipWs();
    if (text[i] === "]") { i++; return { kind: "array", start, end: i, items }; }
    for (;;) {
      const v = parseValue();
      items.push(v);
      skipWs();
      if (text[i] === ",") { i++; continue; }
      if (text[i] === "]") { i++; break; }
      fail("expected ',' or ']'");
    }
    return { kind: "array", start, end: i, items };
  }

  const ESCAPES = { "\"": "\"", "\\": "\\", "/": "/", b: "\b", f: "\f", n: "\n", r: "\r", t: "\t" };

  function parseString() {
    const start = i;
    i++; // opening quote
    let value = "";
    for (;;) {
      const c = text[i];
      if (c === undefined) fail("unterminated string");
      if (c === "\"") { i++; break; }
      if (c === "\\") {
        const n = text[i + 1];
        if (n === "u") {
          const hex = text.slice(i + 2, i + 6);
          value += String.fromCharCode(parseInt(hex, 16));
          i += 6;
        } else if (n in ESCAPES) {
          value += ESCAPES[n];
          i += 2;
        } else {
          fail("invalid escape \\" + n);
        }
      } else {
        value += c;
        i++;
      }
    }
    return { kind: "string", start, end: i, value };
  }

  function parseNumber() {
    const start = i;
    if (text[i] === "-") i++;
    while (text[i] >= "0" && text[i] <= "9") i++;
    if (text[i] === ".") { i++; while (text[i] >= "0" && text[i] <= "9") i++; }
    if (text[i] === "e" || text[i] === "E") {
      i++;
      if (text[i] === "+" || text[i] === "-") i++;
      while (text[i] >= "0" && text[i] <= "9") i++;
    }
    const raw = text.slice(start, i);
    return { kind: "number", start, end: i, value: Number(raw) };
  }

  function parseBoolLiteral() {
    const start = i;
    if (text.slice(i, i + 4) === "true") { i += 4; return { kind: "literal", start, end: i, value: true }; }
    if (text.slice(i, i + 5) === "false") { i += 5; return { kind: "literal", start, end: i, value: false }; }
    fail("invalid literal");
  }

  function parseNullLiteral() {
    const start = i;
    if (text.slice(i, i + 4) === "null") { i += 4; return { kind: "literal", start, end: i, value: null }; }
    fail("invalid literal");
  }

  const root = parseValue();
  skipWs();
  return root;
}

function nodeGet(objNode, key) {
  if (!objNode || objNode.kind !== "object") return undefined;
  // Last key wins, matching JSON.parse's own duplicate-key semantics.
  let result;
  for (const e of objNode.entries) {
    if (e.key === key) result = e.valueNode;
  }
  return result;
}

function nodeToPlain(node) {
  if (!node) return undefined;
  switch (node.kind) {
    case "object": {
      const obj = {};
      for (const e of node.entries) obj[e.key] = nodeToPlain(e.valueNode);
      return obj;
    }
    case "array":
      return node.items.map(nodeToPlain);
    default:
      return node.value;
  }
}

// Splice a set of {start, end, text} edits (offsets into rawText, as produced
// by parseJSONWithPositions) into rawText. Edits must not overlap. Applying
// them back-to-front keeps earlier offsets valid as later ones shift the text.
// At a shared start, a deletion runs before a pure insertion so it can't eat it.
function applyEdits(rawText, edits) {
  const sorted = [...edits].sort((a, b) => b.start - a.start || b.end - a.end);
  let text = rawText;
  for (const e of sorted) {
    text = text.slice(0, e.start) + e.text + text.slice(e.end);
  }
  return text;
}

const ROOT_KEY_ORDER = ["id", "at", "cards"];

function jsonDepth(v) {
  if (v === null || typeof v !== "object") return 0;
  const kids = Array.isArray(v) ? v : Object.values(v);
  return 1 + kids.reduce((m, k) => Math.max(m, jsonDepth(k)), 0);
}

function inlineJSON(v) {
  if (v === null || typeof v !== "object") return JSON.stringify(v);
  if (Array.isArray(v)) return v.length ? "[" + v.map(inlineJSON).join(", ") + "]" : "[]";
  const keys = Object.keys(v);
  return keys.length ? "{ " + keys.map((k) => JSON.stringify(k) + ": " + inlineJSON(v[k])).join(", ") + " }" : "{}";
}

// Serializes a value for splicing at a line indented by `indent`, in the
// hand-authored house style: shallow values that fit in 100 columns stay on
// one line ({ "op": "add", ... }), anything else breaks with 2-space indents.
function formatJSON(v, indent) {
  if (v === null || typeof v !== "object") return JSON.stringify(v);
  const inner = indent + "  ";
  const flat = inlineJSON(v);
  if (jsonDepth(v) <= 2 && inner.length + flat.length <= 100) return flat;
  if (Array.isArray(v)) return "[\n" + v.map((x) => inner + formatJSON(x, inner)).join(",\n") + "\n" + indent + "]";
  return "{\n" + Object.keys(v).map((k) => inner + JSON.stringify(k) + ": " + formatJSON(v[k], inner)).join(",\n") + "\n" + indent + "}";
}

function lineIndent(rawText, pos) {
  const lineStart = rawText.lastIndexOf("\n", pos - 1) + 1;
  return /^[ \t]*/.exec(rawText.slice(lineStart, pos))[0];
}

// Edits turning objNode's source into `next`, touching only the keys whose
// values differ: a changed value is replaced in place, a dropped key is cut
// with its leading comma, and new keys are spliced in after the nearest kept
// key that precedes them in `order`. Removing the first key (or editing an
// empty object) rewrites the whole object instead.
function objectEdits(rawText, objNode, next, order) {
  const entries = objNode.entries;
  const has = (k) => Object.prototype.hasOwnProperty.call(next, k);
  if (entries.length === 0 || !has(entries[0].key)) {
    const out = {};
    for (const k of order) if (has(k)) out[k] = next[k];
    Object.assign(out, next);
    return [{ start: objNode.start, end: objNode.end, text: formatJSON(out, lineIndent(rawText, objNode.start)) }];
  }
  const indent = lineIndent(rawText, entries[0].keyNode.start);
  const edits = [];
  entries.forEach((e, k) => {
    if (!has(e.key)) {
      edits.push({ start: entries[k - 1].valueNode.end, end: e.valueNode.end, text: "" });
    } else if (!deepEqual(nodeToPlain(e.valueNode), next[e.key])) {
      edits.push({ start: e.valueNode.start, end: e.valueNode.end, text: formatJSON(next[e.key], indent) });
    }
  });
  const rank = (k) => (order.includes(k) ? order.indexOf(k) : Infinity);
  const kept = entries.filter((e) => has(e.key));
  const groups = new Map();
  const added = Object.keys(next).filter((k) => !entries.some((e) => e.key === k));
  added.sort((a, b) => rank(a) - rank(b));
  for (const key of added) {
    const before = kept.filter((e) => rank(e.key) < rank(key));
    const anchor = before.length ? before[before.length - 1] : kept[kept.length - 1];
    if (!groups.has(anchor)) groups.set(anchor, []);
    groups.get(anchor).push(key);
  }
  for (const [anchor, keys] of groups) {
    const text = keys.map((k) => ",\n" + indent + JSON.stringify(k) + ": " + formatJSON(next[k], indent)).join("");
    edits.push({ start: anchor.valueNode.end, end: anchor.valueNode.end, text });
  }
  return edits;
}

// Splice edits for everything the mechanics forms changed in `model` against
// `original` (both nodeToPlain(root) at load): the event's `at` plus every
// choice option whose value differs. Untouched options/bytes stay as-is.
function collectModelEdits(rawText, root, original, model) {
  const edits = [];
  if (!deepEqual(original.at, model.at)) {
    const nextRoot = Object.assign({}, original);
    if (model.at === undefined) delete nextRoot.at;
    else nextRoot.at = model.at;
    edits.push(...objectEdits(rawText, root, nextRoot, ROOT_KEY_ORDER));
  }
  const cardsNode = nodeGet(root, "cards");
  if (!cardsNode || cardsNode.kind !== "array") return edits;
  cardsNode.items.forEach((cardNode, i) => {
    const choicesNode = nodeGet(cardNode, "choices");
    if (!choicesNode || choicesNode.kind !== "array") return;
    choicesNode.items.forEach((optNode, j) => {
      if (optNode.kind !== "object") return;
      const before = original.cards[i].choices[j];
      const after = model.cards[i].choices[j];
      if (!deepEqual(before, after)) edits.push(...objectEdits(rawText, optNode, after, OPTION_KEY_ORDER));
    });
  });
  return edits;
}

/* ---------- App state ---------- */

const state = {
  dirHandle: null,
  files: [], // { name, id, handle }
  filterText: "",
  selectionToken: 0,
  current: null, // { fileHandle, name, rawText, root, original, model, fieldBindings: [{node, inputEl, kind}], notes: {originalText, el} }
  mode: "view", // "view" (browsing/editing an existing quest) | "build" (New quest builder)
  builder: null, // { id, at?, cards: [{type, label, speaker, text, choices:[option]}] }
};

const el = {
  openBtn: document.getElementById("open-btn"),
  newQuestBtn: document.getElementById("new-quest-btn"),
  saveBtn: document.getElementById("save-btn"),
  search: document.getElementById("search"),
  fileList: document.getElementById("file-list"),
  fileCount: document.getElementById("file-count"),
  questTitle: document.getElementById("quest-title"),
  status: document.getElementById("status"),
  content: document.getElementById("content"),
};

if (!window.showDirectoryPicker) {
  document.getElementById("app").innerHTML =
    '<div id="unsupported">This tool needs the File System Access API. Open this file in a recent ' +
    "desktop version of Chrome or Edge.</div>";
} else {
  el.openBtn.addEventListener("click", openFolder);
  el.newQuestBtn.addEventListener("click", startNewQuestBuilder);
  el.search.addEventListener("input", () => {
    state.filterText = el.search.value.trim().toLowerCase();
    renderFileList();
  });
  el.saveBtn.addEventListener("click", () => {
    if (state.mode === "build") createNewQuest();
    else saveCurrent();
  });
}

async function openFolder() {
  let handle;
  try {
    handle = await window.showDirectoryPicker({ id: "vein-quest-events", mode: "readwrite" });
  } catch (err) {
    if (err && err.name === "AbortError") return;
    setStatus("Could not open folder: " + err.message, "error");
    return;
  }
  state.dirHandle = handle;
  el.search.disabled = false;
  el.newQuestBtn.disabled = false;
  await indexFolder();
}

async function indexFolder() {
  const files = [];
  for await (const [name, entryHandle] of state.dirHandle.entries()) {
    if (entryHandle.kind !== "file" || !name.endsWith(".json")) continue;
    let id = name.replace(/\.json$/, "");
    try {
      const file = await entryHandle.getFile();
      const text = await file.text();
      const idNode = nodeGet(parseJSONWithPositions(text), "id");
      if (idNode) id = idNode.value;
    } catch (err) {
      /* ignore unreadable/unparsable file, still list it by name */
    }
    files.push({ name, id, handle: entryHandle });
  }
  files.sort((a, b) => a.name.localeCompare(b.name));
  state.files = files;
  renderFileList();
}

function renderFileList() {
  const q = state.filterText;
  const filtered = q
    ? state.files.filter((f) => f.name.toLowerCase().includes(q) || f.id.toLowerCase().includes(q))
    : state.files;

  el.fileCount.textContent = state.files.length
    ? filtered.length + " / " + state.files.length + " quests"
    : "";

  el.fileList.innerHTML = "";
  for (const f of filtered) {
    const row = document.createElement("div");
    row.className = "file-row" + (state.current && state.current.name === f.name ? " active" : "");
    const fname = document.createElement("span");
    fname.className = "fname";
    fname.textContent = f.id;
    row.appendChild(fname);
    if (state.current && state.current.name === f.name && state.current.hasUnsavedChanges) {
      const dot = document.createElement("span");
      dot.className = "dirty-dot";
      dot.textContent = "●";
      dot.title = "Unsaved changes";
      row.appendChild(dot);
    }
    row.addEventListener("click", () => selectFile(f));
    el.fileList.appendChild(row);
  }
}

async function selectFile(f) {
  if (state.mode === "view" && state.current && state.current.hasUnsavedChanges) {
    const proceed = confirm("You have unsaved changes in \"" + state.current.name + "\". Discard them?");
    if (!proceed) return;
  }
  if (state.mode === "build" && !confirm("Discard the quest you're currently building?")) return;
  state.mode = "view";
  state.builder = null;
  // Guard against a second click landing while this one is still awaiting I/O —
  // only the most recent selectFile() call is allowed to update state.current.
  const token = ++state.selectionToken;
  let file, rawText, root, notesText;
  try {
    file = await f.handle.getFile();
    rawText = await file.text();
    root = parseJSONWithPositions(rawText);
    notesText = await loadNotesFor(f.id);
  } catch (err) {
    if (token !== state.selectionToken) return;
    setStatus("Failed to open " + f.name + ": " + err.message, "error");
    return;
  }
  if (token !== state.selectionToken) return;
  state.current = {
    fileHandle: f.handle,
    name: f.name,
    id: f.id,
    rawText,
    root,
    fieldBindings: [],
    notes: { originalText: notesText, el: null },
    hasUnsavedChanges: false,
  };
  renderFileList();
  renderQuest();
}

/* ---------- Quest rendering ---------- */

const TYPE_LABELS = {
  narration: "Narration",
  speaker: "Speaker",
  choice: "Choice",
  resolution: "Resolution",
  craft: "Craft",
  tension: "Tension",
};

function typeLabel(t) {
  return TYPE_LABELS[t] || (t ? t.charAt(0).toUpperCase() + t.slice(1) : "Card");
}

function renderQuest() {
  const q = state.current;
  el.content.innerHTML = "";
  el.saveBtn.disabled = false;
  el.saveBtn.textContent = "Save";
  setStatus("", "");

  const idNode = nodeGet(q.root, "id");
  el.questTitle.textContent = "";
  el.questTitle.appendChild(document.createTextNode(q.name));
  const idSpan = document.createElement("span");
  idSpan.className = "id";
  idSpan.textContent = idNode ? idNode.value : "";
  el.questTitle.appendChild(idSpan);

  // Choice options and `at` are edited on a plain copy of the file and saved
  // through collectModelEdits(); card prose stays on splice bindings.
  q.original = nodeToPlain(q.root);
  q.model = nodeToPlain(q.root);

  const timing = document.createElement("div");
  timing.className = "meta-panel timing-panel";
  const timingHeading = document.createElement("h2");
  timingHeading.textContent = "Event timing";
  timing.appendChild(timingHeading);
  timing.appendChild(renderEventAt(q.model, updateUnsavedFlag));
  el.content.appendChild(timing);

  const cardsNode = nodeGet(q.root, "cards");
  if (cardsNode && cardsNode.kind === "array") {
    cardsNode.items.forEach((cardNode, idx) => renderCard(cardNode, idx));
  }

  renderMetaPanel(q.root);
  renderNotesPanel(q);
}

function renderCard(cardNode, idx) {
  const q = state.current;
  const typeNode = nodeGet(cardNode, "type");
  const type = typeNode ? typeNode.value : "";

  const block = document.createElement("div");
  block.className = "card-block";

  const header = document.createElement("div");
  header.className = "card-block-header";
  const badge = document.createElement("span");
  badge.className = "type-badge";
  badge.textContent = typeLabel(type);
  const indexLabel = document.createElement("span");
  indexLabel.className = "card-index";
  indexLabel.textContent = cardTitle(idx);
  header.appendChild(badge);
  header.appendChild(indexLabel);
  block.appendChild(header);

  const labelNode = nodeGet(cardNode, "label");
  const speakerNode = nodeGet(cardNode, "speaker");
  const textNode = nodeGet(cardNode, "text");

  if (labelNode) block.appendChild(makeEditableField("Label", labelNode, "input"));
  if (speakerNode) block.appendChild(makeEditableField("Speaker", speakerNode, "input"));
  if (textNode) block.appendChild(makeEditableField("Text", textNode, "textarea"));

  const choicesNode = nodeGet(cardNode, "choices");
  if (choicesNode && choicesNode.kind === "array") {
    const wrap = document.createElement("div");
    wrap.className = "choices-wrap";
    const modelChoices = q.model.cards[idx].choices;
    choicesNode.items.forEach((choiceNode, cIdx) => {
      const opt = modelChoices[cIdx];
      if (opt && typeof opt === "object" && !Array.isArray(opt)) wrap.appendChild(renderChoice(opt, cIdx));
    });
    block.appendChild(wrap);
  }

  el.content.appendChild(block);
}

// goto / choice-memory card numbers are 0-based card indices (REFERENCE
// §3.9a), so every card header shows its index next to its 1-based number.
function cardTitle(idx) {
  return "Card " + (idx + 1) + " · idx " + idx;
}

function renderChoice(opt, cIdx) {
  const block = document.createElement("div");
  block.className = "choice-block";

  const header = document.createElement("div");
  header.className = "choice-block-header";
  header.textContent = "Choice " + (cIdx + 1) + " · index " + cIdx;
  block.appendChild(header);

  block.appendChild(mechCell("Choice label", mechText(opt, "label", updateUnsavedFlag, "null"), true));
  block.appendChild(renderOptionMechanics(opt, updateUnsavedFlag));

  return block;
}

function makeEditableField(labelText, node, controlType) {
  const q = state.current;
  const row = document.createElement("div");
  row.className = "field-row";

  const label = document.createElement("label");
  label.textContent = labelText;
  row.appendChild(label);

  const control = document.createElement(controlType === "textarea" ? "textarea" : "input");
  if (controlType !== "textarea") control.type = "text";
  const originalDisplay = node.value === null || node.value === undefined ? "" : String(node.value);
  control.value = originalDisplay;

  control.addEventListener("input", () => {
    control.classList.toggle("edited", control.value !== originalDisplay);
    updateUnsavedFlag();
  });

  row.appendChild(control);

  q.fieldBindings.push({ node, control, originalDisplay });

  return row;
}

function renderMetaPanel(root) {
  const panel = document.createElement("div");
  panel.className = "meta-panel";
  const h2 = document.createElement("h2");
  h2.textContent = "Mechanics (read-only)";
  panel.appendChild(h2);

  for (const key of ["on_complete", "deck", "pin"]) {
    const node = nodeGet(root, key);
    if (!node) continue;
    const field = document.createElement("div");
    field.className = "meta-field";
    const label = document.createElement("div");
    label.className = "meta-label";
    label.textContent = key;
    const pre = document.createElement("div");
    pre.className = "readonly-json";
    pre.textContent = JSON.stringify(nodeToPlain(node), null, 2);
    field.appendChild(label);
    field.appendChild(pre);
    panel.appendChild(field);
  }

  el.content.appendChild(panel);
}

function isBindingDirty(b) {
  return b.control.value !== b.originalDisplay;
}

function updateUnsavedFlag() {
  const q = state.current;
  if (!q) return;
  q.hasUnsavedChanges = q.fieldBindings.some(isBindingDirty) || isNotesDirty(q) || !deepEqual(q.model, q.original);
  renderFileList();
  if (q.hasUnsavedChanges) setStatus("Unsaved changes", "dirty");
  else setStatus("", "");
}

function setStatus(text, kind) {
  el.status.textContent = text;
  el.status.className = kind || "";
}

/* ---------- Author-intent notes sidecar (ticket 03) ---------- */

// data/events/drafts/<id>.notes.md — a plain-text/Markdown sidecar, keyed to
// the quest id, fully independent of the real event JSON. Never parsed,
// never touched by the prose/structure save paths.
function notesFileName(id) {
  return id + ".notes.md";
}

async function loadNotesFor(id) {
  if (!state.dirHandle) return "";
  try {
    const draftsHandle = await state.dirHandle.getDirectoryHandle("drafts");
    const fileHandle = await draftsHandle.getFileHandle(notesFileName(id));
    const file = await fileHandle.getFile();
    return await file.text();
  } catch (err) {
    // No drafts/ dir yet, or no notes file for this id yet — empty panel.
    return "";
  }
}

async function saveNotesFor(id, text) {
  const draftsHandle = await state.dirHandle.getDirectoryHandle("drafts", { create: true });
  const fileHandle = await draftsHandle.getFileHandle(notesFileName(id), { create: true });
  const perm = await fileHandle.requestPermission({ mode: "readwrite" });
  if (perm !== "granted") throw new Error("write permission not granted for notes file");
  const writable = await fileHandle.createWritable();
  await writable.write(text);
  await writable.close();
}

// Only meaningful for view-mode's { originalText, el } notes shape — the
// builder's b.notesText is a plain string with no "originalText" to diff
// against (a brand-new quest has no prior save), so it's written verbatim
// by createNewQuest() instead of going through this dirty check.
function isNotesDirty(q) {
  return !!(q.notes && q.notes.el && q.notes.el.value !== q.notes.originalText);
}

// Shared by the view-mode notes panel below and the builder's notes panel
// (New quest builder section) — same heading/subtitle either way.
function makeNotesPanelShell() {
  const panel = document.createElement("div");
  panel.className = "meta-panel notes-panel";
  const h2 = document.createElement("h2");
  h2.textContent = "Author intent notes";
  panel.appendChild(h2);
  const sub = document.createElement("div");
  sub.className = "meta-label-sub";
  sub.textContent = "Sidecar for Claude — describe what effects/ops/deck/flags should do. Never written to the quest JSON.";
  panel.appendChild(sub);
  return panel;
}

function renderNotesPanel(q) {
  const panel = makeNotesPanelShell();

  const row = document.createElement("div");
  row.className = "field-row";
  const textarea = document.createElement("textarea");
  textarea.placeholder = "e.g. Choice 2 should cost 1 physics ore and add a \"favor_archie\" flag...";
  textarea.value = q.notes.originalText;
  textarea.addEventListener("input", () => {
    textarea.classList.toggle("edited", textarea.value !== q.notes.originalText);
    updateUnsavedFlag();
  });
  row.appendChild(textarea);
  panel.appendChild(row);

  q.notes.el = textarea;
  el.content.appendChild(panel);
}

/* ---------- New quest builder ---------- */

// Ticket 02's dropdown roster. VALID_CARD_TYPES in GameData.gd also allows
// "tension", but the ticket's builder only exposes these five.
const CARD_TYPES = ["narration", "speaker", "choice", "resolution", "craft"];

function defaultCard() {
  return { type: "narration", label: "", speaker: "", text: "", choices: [] };
}

function defaultChoice() {
  return { label: "", result_text: "" };
}

// snake_case: lowercase letters/digits, single underscores between
// segments, no leading/trailing/double underscore — matches every id
// already under data/events/ (col_a1_intro, busker_greenwich, ...).
function validateNewQuestId(id) {
  if (!id) return "Quest id is required.";
  if (!/^[a-z][a-z0-9]*(_[a-z0-9]+)*$/.test(id)) {
    return "Must be snake_case: lowercase letters, digits and single underscores, starting with a letter.";
  }
  const filename = id + ".json";
  const collides = state.files.some((f) => f.name.toLowerCase() === filename.toLowerCase());
  if (collides) return "A file named " + filename + " already exists in data/events/.";
  return "";
}

function startNewQuestBuilder() {
  if (!state.dirHandle) {
    setStatus("Open the data/events folder first.", "error");
    return;
  }
  if (state.mode === "view" && state.current && state.current.hasUnsavedChanges) {
    const proceed = confirm("You have unsaved changes in \"" + state.current.name + "\". Discard them?");
    if (!proceed) return;
  }
  if (state.mode === "build" && !confirm("Discard the quest you're currently building and start a new one?")) {
    return;
  }
  state.current = null;
  state.mode = "build";
  state.builder = { id: "", cards: [defaultCard()], notesText: "" };
  renderFileList();
  renderBuilder();
}

function cancelBuilder() {
  state.mode = "view";
  state.builder = null;
  el.saveBtn.textContent = "Save";
  renderFileList();
  if (state.current) {
    renderQuest();
  } else {
    el.questTitle.textContent = "No quest selected";
    el.saveBtn.disabled = true;
    el.content.innerHTML = '<div id="empty-state">Open the data/events folder, then pick a quest from the sidebar.</div>';
  }
  setStatus("", "");
}

function smallBtn(label, title, disabled, danger, onClick) {
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "small-btn" + (danger ? " small-btn-danger" : "");
  btn.textContent = label;
  btn.title = title;
  btn.disabled = !!disabled;
  btn.addEventListener("click", onClick);
  return btn;
}

// Binds a plain input/textarea straight to obj[key] on a fresh in-memory
// builder card/choice — unlike makeEditableField there's no source text or
// offsets to preserve, so no dirty-tracking or re-render on input needed.
function makeBuilderField(labelText, obj, key, controlType) {
  const row = document.createElement("div");
  row.className = "field-row";
  const label = document.createElement("label");
  label.textContent = labelText;
  row.appendChild(label);
  const control = document.createElement(controlType === "textarea" ? "textarea" : "input");
  if (controlType !== "textarea") control.type = "text";
  control.value = obj[key] || "";
  control.addEventListener("input", () => {
    obj[key] = control.value;
  });
  row.appendChild(control);
  return row;
}

function renderBuilder() {
  const b = state.builder;
  el.content.innerHTML = "";
  el.saveBtn.textContent = "Create quest";
  setStatus("", "");

  el.questTitle.textContent = "";
  el.questTitle.appendChild(document.createTextNode("New quest"));
  const idSpan = document.createElement("span");
  idSpan.className = "id";
  idSpan.id = "builder-title-id";
  idSpan.textContent = b.id ? b.id + ".json" : "";
  el.questTitle.appendChild(idSpan);

  const idPanel = document.createElement("div");
  idPanel.className = "meta-panel";
  const idHeading = document.createElement("h2");
  idHeading.textContent = "New quest id";
  idPanel.appendChild(idHeading);

  const idRow = document.createElement("div");
  idRow.className = "field-row";
  const idLabel = document.createElement("label");
  idLabel.textContent = "Quest id (snake_case) — writes data/events/<id>.json";
  idRow.appendChild(idLabel);
  const idInput = document.createElement("input");
  idInput.type = "text";
  idInput.id = "builder-id-input";
  idInput.value = b.id;
  idInput.placeholder = "e.g. camden_new_lead";
  idInput.addEventListener("input", () => {
    b.id = idInput.value.trim();
    document.getElementById("builder-title-id").textContent = b.id ? b.id + ".json" : "";
    updateBuilderValidity();
  });
  idRow.appendChild(idInput);
  const idError = document.createElement("div");
  idError.id = "builder-id-error";
  idError.style.cssText = "color:var(--danger); font-size:12px; margin-top:4px; min-height:14px;";
  idRow.appendChild(idError);
  idPanel.appendChild(idRow);
  idPanel.appendChild(renderEventAt(b, () => {}));

  const cancelBtn = document.createElement("button");
  cancelBtn.type = "button";
  cancelBtn.className = "cancel-btn";
  cancelBtn.textContent = "Cancel";
  cancelBtn.addEventListener("click", cancelBuilder);
  idPanel.appendChild(cancelBtn);

  el.content.appendChild(idPanel);

  b.cards.forEach((card, idx) => el.content.appendChild(renderBuilderCard(card, idx, b.cards)));

  const addCardBtn = document.createElement("button");
  addCardBtn.type = "button";
  addCardBtn.className = "add-card-btn";
  addCardBtn.textContent = "+ Add card";
  addCardBtn.addEventListener("click", () => {
    b.cards.push(defaultCard());
    renderBuilder();
  });
  el.content.appendChild(addCardBtn);

  const notesPanel = makeNotesPanelShell();
  notesPanel.appendChild(makeBuilderField("Notes for Claude", b, "notesText", "textarea"));
  el.content.appendChild(notesPanel);

  updateBuilderValidity();
}

function renderBuilderCard(card, idx, cardsArray) {
  const block = document.createElement("div");
  block.className = "card-block";

  const header = document.createElement("div");
  header.className = "card-block-header";

  const typeSelect = document.createElement("select");
  typeSelect.className = "type-select";
  CARD_TYPES.forEach((t) => {
    const opt = document.createElement("option");
    opt.value = t;
    opt.textContent = typeLabel(t);
    if (t === card.type) opt.selected = true;
    typeSelect.appendChild(opt);
  });
  typeSelect.addEventListener("change", () => {
    card.type = typeSelect.value;
    if (card.type === "choice" && (!card.choices || card.choices.length === 0)) {
      card.choices = [defaultChoice()];
    }
    renderBuilder();
  });
  header.appendChild(typeSelect);

  const indexLabel = document.createElement("span");
  indexLabel.className = "card-index";
  indexLabel.textContent = cardTitle(idx);
  header.appendChild(indexLabel);

  const spacer = document.createElement("span");
  spacer.style.flex = "1";
  header.appendChild(spacer);

  header.appendChild(smallBtn("▲", "Move card up", idx === 0, false, () => {
    [cardsArray[idx - 1], cardsArray[idx]] = [cardsArray[idx], cardsArray[idx - 1]];
    renderBuilder();
  }));
  header.appendChild(smallBtn("▼", "Move card down", idx === cardsArray.length - 1, false, () => {
    [cardsArray[idx + 1], cardsArray[idx]] = [cardsArray[idx], cardsArray[idx + 1]];
    renderBuilder();
  }));
  header.appendChild(smallBtn("✕", "Remove card", false, true, () => {
    cardsArray.splice(idx, 1);
    renderBuilder();
  }));

  block.appendChild(header);

  block.appendChild(makeBuilderField("Label", card, "label", "input"));
  block.appendChild(makeBuilderField("Speaker", card, "speaker", "input"));
  block.appendChild(makeBuilderField("Text", card, "text", "textarea"));

  if (card.type === "choice") {
    const wrap = document.createElement("div");
    wrap.className = "choices-wrap";
    card.choices.forEach((choice, cIdx) => wrap.appendChild(renderBuilderChoice(choice, cIdx, card.choices)));
    const addChoiceBtn = document.createElement("button");
    addChoiceBtn.type = "button";
    addChoiceBtn.className = "add-choice-btn";
    addChoiceBtn.textContent = "+ Add choice";
    addChoiceBtn.addEventListener("click", () => {
      card.choices.push(defaultChoice());
      renderBuilder();
    });
    wrap.appendChild(addChoiceBtn);
    block.appendChild(wrap);
  }

  return block;
}

function renderBuilderChoice(choice, cIdx, choicesArray) {
  const block = document.createElement("div");
  block.className = "choice-block";

  const header = document.createElement("div");
  header.className = "choice-block-header";
  const title = document.createElement("span");
  title.textContent = "Choice " + (cIdx + 1) + " · index " + cIdx;
  header.appendChild(title);
  header.appendChild(smallBtn("✕", "Remove choice", false, true, () => {
    choicesArray.splice(cIdx, 1);
    renderBuilder();
  }));
  block.appendChild(header);

  block.appendChild(makeBuilderField("Choice label", choice, "label", "input"));
  block.appendChild(renderOptionMechanics(choice, () => {}));

  return block;
}

function updateBuilderValidity() {
  const b = state.builder;
  if (!b) return;
  const err = validateNewQuestId(b.id);
  const errEl = document.getElementById("builder-id-error");
  if (errEl) errEl.textContent = err;
  el.saveBtn.disabled = !!err;
}

// Builds the plain object saved to data/events/<id>.json: same key set and
// order GameData._validate_events()/systems/events.gd expect (id, at?,
// cards, on_complete), options normalized by buildOptionForSave(), and no
// "deck" key so the file stays unregistered/inert.
function buildQuestObject(b) {
  const obj = { id: b.id };
  if (b.at) obj.at = deepClone(b.at);
  return Object.assign(obj, {
    cards: b.cards.map((c) => {
      const card = { type: c.type, label: normProse(c.label), speaker: normProse(c.speaker), text: normProse(c.text) };
      if (c.type === "choice") card.choices = c.choices.map(buildOptionForSave);
      return card;
    }),
    // GameData._on_complete_navigates() requires a "set_screen" (or other
    // self-navigating) op before an event can ever be registered/validated;
    // this default (also used verbatim by busker_greenwich.json and other
    // district events) keeps a freshly created file valid the moment a
    // later Claude pass registers it, without this v1 tool touching
    // mechanics. Swap it as part of that later wiring pass if needed.
    on_complete: [{ op: "set_screen", screen: "map" }],
  });
}

async function createNewQuest() {
  const b = state.builder;
  if (!b) return;
  const err = validateNewQuestId(b.id);
  if (err) {
    setStatus(err, "error");
    return;
  }
  if (!state.dirHandle) {
    setStatus("Open the data/events folder first.", "error");
    return;
  }

  const text = JSON.stringify(buildQuestObject(b), null, 2) + "\n";
  let fileHandle;
  try {
    fileHandle = await state.dirHandle.getFileHandle(b.id + ".json", { create: true });
    const perm = await fileHandle.requestPermission({ mode: "readwrite" });
    if (perm !== "granted") throw new Error("write permission not granted");
    const writable = await fileHandle.createWritable();
    await writable.write(text);
    await writable.close();
  } catch (writeErr) {
    setStatus("Create failed: " + writeErr.message, "error");
    return;
  }

  const createdId = b.id;
  const notesText = b.notesText || "";
  let notesError = null;
  if (notesText.trim() !== "") {
    try {
      await saveNotesFor(createdId, notesText);
    } catch (err) {
      notesError = err;
    }
  }

  state.mode = "view";
  state.builder = null;
  el.saveBtn.textContent = "Save";
  await indexFolder();
  const created = state.files.find((f) => f.name === createdId + ".json");
  if (created) await selectFile(created);
  if (notesError) {
    // selectFile() just loaded (empty) notes from disk since the write above
    // failed — restore the author's still-unsaved draft rather than losing it.
    if (state.current && state.current.id === createdId && state.current.notes.el) {
      state.current.notes.el.value = notesText;
      state.current.notes.el.classList.toggle("edited", true);
      state.current.hasUnsavedChanges = true;
      renderFileList();
    }
    setStatus("Created " + createdId + ".json, but notes save failed: " + notesError.message, "error");
  } else {
    setStatus("Created " + createdId + ".json", "ok");
  }
}

/* ---------- Save ---------- */

async function saveCurrent() {
  const q = state.current;
  if (!q) return;

  const edits = q.fieldBindings
    .filter(isBindingDirty)
    .map((b) => ({ start: b.node.start, end: b.node.end, text: JSON.stringify(b.control.value) }))
    .concat(collectModelEdits(q.rawText, q.root, q.original, q.model));
  const notesDirty = isNotesDirty(q);
  // Captured before any re-render, so a failed notes write can restore the
  // user's still-unsaved draft instead of silently reverting the textarea.
  const pendingNotesValue = q.notes.el ? q.notes.el.value : q.notes.originalText;

  if (edits.length === 0 && !notesDirty) {
    setStatus("Nothing to save", "ok");
    return;
  }

  if (edits.length > 0) {
    const text = applyEdits(q.rawText, edits);
    try {
      const perm = await q.fileHandle.requestPermission({ mode: "readwrite" });
      if (perm !== "granted") throw new Error("write permission not granted");

      const writable = await q.fileHandle.createWritable();
      await writable.write(text);
      await writable.close();
    } catch (err) {
      setStatus("Save failed: " + err.message, "error");
      return;
    }
    // Re-parse the freshly written text so bindings/offsets stay valid for further edits.
    q.rawText = text;
    q.root = parseJSONWithPositions(text);
  }
  // renderQuest() below always rebuilds fieldBindings from scratch (via
  // makeEditableField's push) — clear the stale array first whichever
  // branch above ran, or a notes-only save would leave old bindings
  // (pointing at now-detached nodes) piled up alongside the new ones.
  q.fieldBindings = [];

  let notesError = null;
  if (notesDirty) {
    try {
      await saveNotesFor(q.id, pendingNotesValue);
      q.notes.originalText = pendingNotesValue;
    } catch (err) {
      notesError = err;
    }
  }

  q.hasUnsavedChanges = !!notesError;
  renderQuest();
  renderFileList();
  if (notesError) {
    // Restore the unsaved draft into the freshly rendered textarea so it isn't lost.
    q.notes.el.value = pendingNotesValue;
    q.notes.el.classList.toggle("edited", true);
    setStatus("Saved quest, but notes save failed: " + notesError.message, "error");
  } else {
    setStatus("Saved", "ok");
  }
}
</script>
</body>
